<!-- Micro-interaction Script for Real-time Counter Simulation -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Retrieve config or use defaults for demo purposes
            const salary = parseFloat(localStorage.getItem('salary')) || 10000;
            const workDays = parseFloat(localStorage.getItem('workDays')) || 21.75;
            const startTimeStr = localStorage.getItem('startTime') || '09:00';
            const endTimeStr = localStorage.getItem('endTime') || '18:00';
            const lunchBreak = parseFloat(localStorage.getItem('lunchBreak')) || 1.5;

            // DOM Elements
            const heroCounter = document.getElementById('hero-counter');
            const netValueEl = document.getElementById('net-value');
            const progressPercentEl = document.getElementById('progress-percent');
            const progressFillEl = document.getElementById('progress-fill');
            const workedTimeTextEl = document.getElementById('worked-time-text');
            const leftTimeTextEl = document.getElementById('left-time-text');
            
            const hourlyWageEl = document.getElementById('hourly-wage');
            const minuteWageEl = document.getElementById('minute-wage');
            const secondWageEl = document.getElementById('second-wage');

            // Parse times
            const parseTime = (timeStr) => {
                const [h, m] = timeStr.split(':').map(Number);
                return { h, m, totalSeconds: h * 3600 + m * 60 };
            };

            const start = parseTime(startTimeStr);
            const end = parseTime(endTimeStr);
            
            // Lunch break in seconds
            const lunchBreakSeconds = lunchBreak * 3600;
            
            // Total daily work seconds
            const totalWorkSeconds = (end.totalSeconds - start.totalSeconds) - lunchBreakSeconds;
            
            // Hourly wage calculations
            const hourlyWage = salary / (workDays * (totalWorkSeconds / 3600));
            const secondWage = hourlyWage / 3600;
            const minuteWage = hourlyWage / 60;

            // Update UI with static wages
            hourlyWageEl.textContent = `¥${hourlyWage.toFixed(2)}`;
            minuteWageEl.textContent = `¥${minuteWage.toFixed(2)}`;
            secondWageEl.textContent = `¥${secondWage.toFixed(4)}`;

            // Expenses (static for demo)
            const expenses = 42.50;

            function formatDuration(totalSeconds) {
                if (totalSeconds < 0) totalSeconds = 0;
                const h = Math.floor(totalSeconds / 3600);
                const m = Math.floor((totalSeconds % 3600) / 60);
                return `${String(h).padStart(2, '0')}h ${String(m).padStart(2, '0')}m`;
            }

            function update() {
                const now = new Date();
                const currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
                
                let workedSeconds = 0;
                
                if (currentSeconds <= start.totalSeconds) {
                    workedSeconds = 0;
                } else if (currentSeconds >= end.totalSeconds) {
                    workedSeconds = totalWorkSeconds;
                } else {
                    // Simple logic assuming lunch is exactly in the middle of the day for calculation simplicity, 
                    // or just subtracting proportionally if past halfway.
                    // For a robust app, we'd need exact lunch start/end times.
                    // Let's assume lunch is from 12:00 to 13:30 (approx midway) if lunchBreak > 0
                    // A simple approximation: if we worked more than half the day, subtract lunch.
                    workedSeconds = currentSeconds - start.totalSeconds;
                    const midpoint = start.totalSeconds + (end.totalSeconds - start.totalSeconds) / 2;
                    if (currentSeconds > midpoint) {
                         workedSeconds -= lunchBreakSeconds;
                    }
                }
                
                // Ensure workedSeconds doesn't exceed totalWorkSeconds or drop below 0
                workedSeconds = Math.max(0, Math.min(workedSeconds, totalWorkSeconds));

                // Earned today
                const earnedToday = workedSeconds * secondWage;
                
                // Left seconds
                let leftSeconds = end.totalSeconds - currentSeconds;
                if (currentSeconds > start.totalSeconds && currentSeconds < end.totalSeconds) {
                    const midpoint = start.totalSeconds + (end.totalSeconds - start.totalSeconds) / 2;
                    if (currentSeconds <= midpoint) {
                        leftSeconds -= lunchBreakSeconds;
                    }
                }
                leftSeconds = Math.max(0, Math.min(leftSeconds, totalWorkSeconds));
                
                // Progress
                let progress = (workedSeconds / totalWorkSeconds) * 100;
                progress = Math.max(0, Math.min(100, progress));

                // Update DOM
                heroCounter.textContent = earnedToday.toFixed(2);
                netValueEl.textContent = `¥${(earnedToday - expenses).toFixed(2)}`;
                
                progressPercentEl.textContent = `${progress.toFixed(0)}%`;
                progressFillEl.style.width = `${progress}%`;
                
                workedTimeTextEl.innerHTML = `<span class="material-symbols-outlined text-[16px]">schedule</span> 已工作 ${formatDuration(workedSeconds)}`;
                leftTimeTextEl.innerHTML = `${formatDuration(leftSeconds)} 距离下班`;
                
                // Slight pop animation on update for hero
                heroCounter.style.transform = 'scale(1.01)';
                setTimeout(() => {
                    heroCounter.style.transform = 'scale(1)';
                }, 100);
            }

            // Initial update
            update();
            
            // Update every second
            setInterval(update, 1000);
        });
    </script>

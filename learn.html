<main class="flex-1 px-margin-page pt-28 pb-32 flex flex-col gap-stack-lg max-w-md mx-auto w-full">

    <!-- 累计加薪总额 -->
    <section class="bg-surface-container-low rounded-2xl p-5 flex flex-col items-center animate-fade-in-up">
        <span class="font-label-sm text-label-sm text-on-surface-variant">累计学习加薪</span>
        <div class="flex items-baseline gap-1 mt-1">
            <span class="font-display-lg text-display-lg text-tertiary-fixed-dim" id="total-bonus-display">+¥0.00</span>
            <span class="font-body-md text-body-md text-on-surface-variant">/ 小时</span>
        </div>
        <p class="font-label-sm text-label-sm text-on-surface-variant opacity-60 mt-1">完成学习目标即可获得加薪 🎓</p>
    </section>

    <!-- 🆕 计时器区域（从底部移到这里） -->
    <section class="bg-surface-container-low rounded-2xl p-5 flex flex-col items-center gap-4 animate-fade-in-up" style="animation-delay:0.1s;">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined text-on-surface-variant">timer</span>
            <span class="font-label-sm text-label-sm text-on-surface-variant">今日学习计时</span>
        </div>
        <div class="font-display-lg text-display-lg text-primary tabular-nums" id="timer-display">00:00:00</div>
        <div class="flex gap-4">
            <button class="w-14 h-14 rounded-full bg-primary text-on-primary flex items-center justify-center active:scale-95 transition-transform shadow-md" id="timer-start-btn">
                <span class="material-symbols-outlined text-[28px]">play_arrow</span>
            </button>
            <button class="w-14 h-14 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center active:scale-95 transition-transform" id="timer-reset-btn">
                <span class="material-symbols-outlined text-[28px]">replay</span>
            </button>
        </div>
        <div class="w-full mt-2">
            <label class="font-label-sm text-label-sm text-on-surface-variant block mb-1">选择要记录时长的目标</label>
            <select class="w-full bg-surface-container-lowest border-0 rounded-xl px-4 py-3 font-body-md text-body-md text-primary focus:ring-0 outline-none" id="timer-goal-select">
                <option value="">-- 请先创建目标 --</option>
            </select>
        </div>
    </section>

    <!-- 学习目标列表 -->
    <section class="flex flex-col gap-stack-md animate-fade-in-up" style="animation-delay:0.2s;">
        <div class="flex items-center justify-between">
            <h3 class="font-headline-md-mobile text-headline-md-mobile text-primary">我的学习目标</h3>
            <button class="text-primary/70 hover:text-primary transition-colors text-sm flex items-center gap-1" id="btn-add-goal">
                <span class="material-symbols-outlined text-[18px]">add_circle</span>
                新建
            </button>
        </div>
        <div class="flex flex-col gap-stack-md w-full" id="goals-container">
            <!-- 由 JavaScript 动态渲染 -->
        </div>
    </section>

</main>

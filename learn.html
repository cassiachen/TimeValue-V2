<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport" />
    <title>学习涨薪 - 时值 TimeValue</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries">
    </script>
    <script src="shared/storage.js"></script>
    <script src="shared/toast.js"></script>
    <script src="shared/modal.js"></script>
    <script src="shared/nav.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="shared/tailwind-config.js"></script>
    <link href="shared/base.css" rel="stylesheet" />
    <style>
        @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .timer-running { animation: pulse 1.5s ease-in-out infinite; }
        .completed-badge { background: #e8f5e9; color: #2e7d32; border-radius: 999px; padding: 2px 12px; font-size: 12px; font-weight: 500; }
        .delete-goal-btn:hover .material-symbols-outlined { font-variation-settings: 'FILL' 1; }

        .progress-bonus-tag {
            background: linear-gradient(135deg, #4edea3 0%, #6ffbbe 100%);
            color: #005236;
            font-size: 13px;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 16px rgba(78, 222, 163, 0.3);
            transition: all 0.3s ease;
        }
        .progress-bonus-tag .material-symbols-outlined { font-size: 16px; }

        /* 🆕 本次学习加薪结果提示 */
        .result-bonus-toast {
            background: linear-gradient(135deg, #4edea3 0%, #6ffbbe 100%);
            color: #005236;
            font-size: 14px;
            font-weight: 700;
            padding: 8px 18px;
            border-radius: 999px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(78, 222, 163, 0.35);
            opacity: 0;
            transform: scale(0.9);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }
        .result-bonus-toast.show {
            opacity: 1;
            transform: scale(1);
            pointer-events: none;
        }
        .result-bonus-toast .material-symbols-outlined { font-size: 20px; }

        .ref-hint { font-size: 11px; color: #77767b; background: #f3f3f5; padding: 6px 12px; border-radius: 8px; margin-top: 4px; line-height: 1.5; }
        .ref-hint strong { color: #030304; }

        @keyframes bonus-pop { 0% { transform: scale(1); } 30% { transform: scale(1.12); color: #6ffbbe; } 60% { transform: scale(0.95); } 100% { transform: scale(1); color: #4edea3; } }
        .bonus-pop { animation: bonus-pop 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
</head>
<body class="bg-background text-on-background font-body-lg text-body-lg min-h-screen antialiased flex flex-col">

    <!-- TopAppBar（由 shared/nav.js 渲染，见页面底部脚本） -->
    <div id="tv-topbar"></div>

    <main class="flex-1 px-margin-page pt-28 pb-32 flex flex-col gap-stack-lg max-w-md mx-auto w-full">

        <!-- ===== 1. 累计加薪总额 ===== -->
        <section class="bg-surface-container-low rounded-2xl p-5 flex flex-col items-center animate-fade-in-up">
            <span class="font-label-sm text-label-sm text-on-surface-variant">累计学习加薪</span>
            <div class="flex items-baseline gap-1 mt-1">
                <span class="font-display-lg text-display-lg text-tertiary-fixed-dim" id="total-bonus-display">+¥0.00</span>
                <span class="font-body-md text-body-md text-on-surface-variant">/ 小时</span>
            </div>
            <p class="font-label-sm text-label-sm text-on-surface-variant opacity-60 mt-1">🎯 学多少，加多少！每分每秒都在涨薪</p>
        </section>

        <!-- ===== 2. 计时器 / 番茄钟 ===== -->
        <section class="bg-surface-container-low rounded-2xl p-5 flex flex-col items-center gap-4 animate-fade-in-up" style="animation-delay:0.1s;">

            <div class="flex items-center gap-2">
                <span class="material-symbols-outlined text-on-surface-variant">timer</span>
                <span class="font-label-sm text-label-sm text-on-surface-variant">今日学习计时</span>
            </div>

            <div class="font-display-lg text-display-lg text-primary tabular-nums" id="timer-display">00:00:00</div>

            <!-- 进度加薪标签（计时中实时显示） -->
            <div id="progress-bonus-wrapper" style="display:none;">
                <span class="progress-bonus-tag" id="progress-bonus-tag">
                    <span class="material-symbols-outlined">trending_up</span>
                    本次学习 +¥<span id="progress-bonus-amount">0.00</span> / 小时
                </span>
            </div>

            <!-- 🆕 本次学习加薪结果（计时结束后显示） -->
            <div id="result-bonus-toast" class="result-bonus-toast">
                <span class="material-symbols-outlined">celebration</span>
                本次学习 +¥<span id="result-bonus-amount">0.00</span> / 小时
            </div>

            <div class="flex gap-4">
                <button class="w-14 h-14 rounded-full bg-primary text-on-primary flex items-center justify-center active:scale-95 transition-transform shadow-md" id="timer-start-btn">
                    <span class="material-symbols-outlined text-[28px]">play_arrow</span>
                </button>
                <button class="w-14 h-14 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center active:scale-95 transition-transform" id="timer-reset-btn">
                    <span class="material-symbols-outlined text-[28px]">replay</span>
                </button>
            </div>

            <div class="w-full mt-2">
                <label class="font-label-sm text-label-sm text-on-surface-variant block mb-1">选择要记录时长的目标</label>
                <select class="w-full bg-surface-container-lowest border-0 rounded-xl px-4 py-3 font-body-md text-body-md text-primary focus:ring-0 outline-none" id="timer-goal-select">
                    <option value="">-- 请先创建目标 --</option>
                </select>
            </div>

            <p class="text-xs text-on-surface-variant/40 text-center mt-1">⏱️ 点击开始计时，暂停时自动保存</p>
        </section>

        <!-- ===== 3. 学习目标列表 ===== -->
        <section class="flex flex-col gap-stack-md animate-fade-in-up" style="animation-delay:0.2s;">

            <div class="flex items-center justify-between">
                <h3 class="font-headline-md-mobile text-headline-md-mobile text-primary">我的学习目标</h3>
                <button class="text-primary/70 hover:text-primary transition-colors text-sm flex items-center gap-1" id="btn-add-goal">
                    <span class="material-symbols-outlined text-[18px]">add_circle</span> 新建
                </button>
            </div>

            <div class="flex flex-col gap-stack-md w-full" id="goals-container">
                <!-- 由 JavaScript 动态渲染 -->
            </div>

        </section>

    </main>

    <!-- ===== 底部导航（由 shared/nav.js 渲染，见页面底部脚本） ===== -->
    <div id="tv-bottomnav"></div>

    <!-- ===== 品牌水印 ===== -->
    <div class="text-center py-2 pb-safe">
        <span class="text-[11px] text-outline/40 tracking-[0.15em] font-light select-none">Cassia · 2025</span>
    </div>

    <!-- ============================================================
    JavaScript
    ============================================================ -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // ============================================================
            // 0. 渲染共享导航（顶部栏 + 底部 tab）
            // ============================================================
            TV.nav.renderTopBar({ title: '学习涨薪' });
            TV.nav.renderBottomNav('learn.html');

            // ============================================================
            // 1. 数据管理
            // ============================================================

            function loadGoals() {
                var parsed = TV.storage.get('learningGoals', null);
                if (Array.isArray(parsed)) return parsed;
                var defaults = [
                    { id: Date.now() + 1, skillName: 'Python 编程', targetHours: 20, completedHours: 0, bonus: 5, isCompleted: false },
                    { id: Date.now() + 2, skillName: '英语口语', targetHours: 15, completedHours: 0, bonus: 3, isCompleted: false }
                ];
                saveGoals(defaults);
                return defaults;
            }

            function saveGoals(goals) { TV.storage.set('learningGoals', goals); }

            var goals = loadGoals();

            // ============================================================
            // 按比例计算加薪（学多少加多少）
            // ============================================================
            function recalcTotalBonus() {
                var sum = 0;
                goals.forEach(function(g) {
                    if (g.targetHours > 0) {
                        var progress = Math.min(1, g.completedHours / g.targetHours);
                        sum += progress * g.bonus;
                    }
                });
                // 保留两位小数存储，避免浮点漂移
                sum = Math.round(sum * 100) / 100;
                TV.storage.set('learningTotalBonus', String(sum));
                return sum;
            }

            var totalBonus = recalcTotalBonus();

            // ============================================================
            // 2. 计时器逻辑（持久化存储）
            // ============================================================

            var TIMER_STATE_KEY = 'learningTimerState';

            function loadTimerState() {
                var parsed = TV.storage.get(TIMER_STATE_KEY, null);
                if (parsed && typeof parsed.seconds === 'number') {
                    return parsed;
                }
                return { seconds: 0, isRunning: false, selectedGoalIndex: null, lastUpdateTime: null };
            }

            function saveTimerState(state) { TV.storage.set(TIMER_STATE_KEY, state); }

            var timerState = loadTimerState();
            var timerSeconds = timerState.seconds || 0;
            var isTimerRunning = timerState.isRunning || false;
            var selectedGoalIndex = timerState.selectedGoalIndex !== undefined ? timerState.selectedGoalIndex : null;
            var timerInterval = null;

            var timerDisplay = document.getElementById('timer-display');
            var startBtn = document.getElementById('timer-start-btn');
            var resetBtn = document.getElementById('timer-reset-btn');
            var goalSelect = document.getElementById('timer-goal-select');
            var progressBonusWrapper = document.getElementById('progress-bonus-wrapper');
            var progressBonusAmount = document.getElementById('progress-bonus-amount');

            // 结果加薪提示
            var resultToast = document.getElementById('result-bonus-toast');
            var resultBonusAmount = document.getElementById('result-bonus-amount');
            var resultToastTimer = null;

            function showResultBonus(amount) {
                if (resultToastTimer) clearTimeout(resultToastTimer);
                resultBonusAmount.textContent = amount.toFixed(2);
                resultToast.classList.add('show');
                resultToastTimer = setTimeout(function() {
                    resultToast.classList.remove('show');
                }, 4000);
            }

            function formatTime(sec) {
                var h = String(Math.floor(sec / 3600)).padStart(2, '0');
                var m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
                var s = String(sec % 60).padStart(2, '0');
                return h + ':' + m + ':' + s;
            }

            function updateTimerDisplay() {
                timerDisplay.textContent = formatTime(timerSeconds);
                timerState.seconds = timerSeconds;
                timerState.isRunning = isTimerRunning;
                timerState.selectedGoalIndex = selectedGoalIndex;
                timerState.lastUpdateTime = Date.now();
                saveTimerState(timerState);
                updateProgressBonus();
            }

            function updateProgressBonus() {
                if (selectedGoalIndex !== null && selectedGoalIndex >= 0 && selectedGoalIndex < goals.length) {
                    var goal = goals[selectedGoalIndex];
                    if (goal && !goal.isCompleted && goal.targetHours > 0) {
                        var hoursSoFar = timerSeconds / 3600;
                        var earnedBonus = (hoursSoFar / goal.targetHours) * goal.bonus;
                        earnedBonus = Math.min(earnedBonus, goal.bonus);
                        if (earnedBonus > 0.0001) {
                            progressBonusWrapper.style.display = 'block';
                            progressBonusAmount.textContent = earnedBonus.toFixed(2);
                            return;
                        }
                    }
                }
                progressBonusWrapper.style.display = 'none';
            }

            // startTimer 使用 showAlert
            async function startTimer() {
                if (isTimerRunning) return;
                var idx = parseInt(goalSelect.value, 10);
                if (isNaN(idx) || idx < 0 || idx >= goals.length) {
                    await showAlert('提示', '请先选择一个学习目标');
                    return;
                }
                var goal = goals[idx];
                if (goal.isCompleted) {
                    await showAlert('提示', '🎉 这个目标已经完成啦！请选择其他目标。');
                    return;
                }

                selectedGoalIndex = idx;
                timerState.selectedGoalIndex = idx;

                isTimerRunning = true;
                timerState.isRunning = true;
                timerState.lastUpdateTime = Date.now();
                saveTimerState(timerState);

                startBtn.innerHTML = '<span class="material-symbols-outlined text-[28px]">pause</span>';
                startBtn.classList.add('timer-running');

                if (timerInterval) clearInterval(timerInterval);
                timerInterval = setInterval(function() {
                    timerSeconds++;
                    updateTimerDisplay();
                }, 1000);
            }

            // pauseTimer 使用 showConfirm
            async function pauseTimer() {
                if (!isTimerRunning) return;
                isTimerRunning = false;
                timerState.isRunning = false;
                timerState.lastUpdateTime = Date.now();
                saveTimerState(timerState);

                startBtn.innerHTML = '<span class="material-symbols-outlined text-[28px]">play_arrow</span>';
                startBtn.classList.remove('timer-running');
                clearInterval(timerInterval);
                timerInterval = null;

                if (timerSeconds > 0) {
                    var shouldSave = await showConfirm('保存学习', '⏱️ 已学习 ' + formatTime(timerSeconds) + '\n要保存到目标吗？');
                    if (shouldSave) {
                        await saveTimerToGoal();
                    }
                }
                updateTimerDisplay();
            }

            // resetTimer 使用 showConfirm
            async function resetTimer() {
                if (timerSeconds > 0 && isTimerRunning) {
                    if (!await showConfirm('重置确认', '确定要重置计时器吗？当前学习记录将丢失。')) return;
                }
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                isTimerRunning = false;
                timerState.isRunning = false;
                timerState.seconds = 0;
                timerState.lastUpdateTime = null;
                saveTimerState(timerState);

                timerSeconds = 0;
                startBtn.innerHTML = '<span class="material-symbols-outlined text-[28px]">play_arrow</span>';
                startBtn.classList.remove('timer-running');
                updateTimerDisplay();
            }

            // 🆕 saveTimerToGoal - 修复加薪累积
            async function saveTimerToGoal() {
                if (timerSeconds === 0) {
                    await showAlert('提示', '今天还没有学习呢，先学一会儿吧！');
                    return;
                }

                var idx = selectedGoalIndex;
                if (idx === null || idx < 0 || idx >= goals.length) {
                    var selectVal = goalSelect.value;
                    if (selectVal === '') {
                        await showAlert('提示', '请先选择一个学习目标');
                        return;
                    }
                    idx = parseInt(selectVal, 10);
                }

                var goal = goals[idx];
                if (!goal) return;

                if (goal.isCompleted) {
                    await showAlert('提示', '🎉 这个目标已经完成啦！请选择其他目标或创建新目标。');
                    return;
                }

                var hoursToAdd = timerSeconds / 3600;

                // 🆕 计算本次学习前已获得的加薪
                var previousEarned = (goal.completedHours / goal.targetHours) * goal.bonus;
                previousEarned = Math.min(previousEarned, goal.bonus);

                // 🆕 直接累加，不四舍五入（保留精度）
                goal.completedHours = goal.completedHours + hoursToAdd;

                var wasCompleted = goal.isCompleted;
                if (goal.completedHours >= goal.targetHours) {
                    goal.isCompleted = true;
                    goal.completedHours = goal.targetHours;
                }

                saveGoals(goals);

                // 🆕 重新计算总加薪
                var newTotalBonus = recalcTotalBonus();
                updateTotalBonusDisplay();

                // 重新渲染目标列表和下拉菜单
                renderGoals();
                populateGoalSelect();

                // 计算本次学习获得的加薪
                var earnedNow = (goal.completedHours / goal.targetHours) * goal.bonus;
                earnedNow = Math.min(earnedNow, goal.bonus);
                var earnedThisTime = Math.round((earnedNow - previousEarned) * 100) / 100;

                // 🆕 显示本次加薪结果（在弹窗之前显示）
                if (earnedThisTime > 0.001) {
                    showResultBonus(earnedThisTime);
                }

                var progress = Math.min(100, (goal.completedHours / goal.targetHours) * 100);

                // 弹窗显示
                if (goal.isCompleted && !wasCompleted) {
                    await showAlert('🎉 完成', '恭喜完成「' + goal.skillName + '」！\n累计获得 +' + earnedNow.toFixed(2) + ' 元/小时加薪！');
                } else {
                    await showAlert('📚 加油', '继续加油！\n' + goal.skillName + ' 已完成 ' + goal.completedHours.toFixed(1) + '/' + goal.targetHours +
                        ' 小时（' + progress.toFixed(0) + '%）\n当前已获得 +' + earnedNow.toFixed(2) + ' 元/小时加薪');
                }

                // 重置计时器
                timerSeconds = 0;
                timerState.seconds = 0;
                saveTimerState(timerState);
                updateTimerDisplay();
                startBtn.innerHTML = '<span class="material-symbols-outlined text-[28px]">play_arrow</span>';
                startBtn.classList.remove('timer-running');
                if (timerInterval) {
                    clearInterval(timerInterval);
                    timerInterval = null;
                }
                isTimerRunning = false;
                timerState.isRunning = false;
                saveTimerState(timerState);
                progressBonusWrapper.style.display = 'none';
            }

            startBtn.addEventListener('click', function() {
                if (isTimerRunning) { pauseTimer(); } else { startTimer(); }
            });

            resetBtn.addEventListener('click', function() { resetTimer(); });

            // ============================================================
            // 3. 渲染目标列表
            // ============================================================

            function renderGoals() {
                var container = document.getElementById('goals-container');
                if (!container) return;

                if (goals.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-8 text-on-surface-variant opacity-60">
                            <span class="material-symbols-outlined text-[48px] block mx-auto mb-3">school</span>
                            <p class="font-body-md text-body-md">还没有学习目标</p>
                            <p class="font-label-sm text-label-sm">点击右上角「新建」添加</p>
                        </div>
                    `;
                    return;
                }

                var html = '';
                goals.forEach(function(goal, index) {
                    var progress = Math.min(100, (goal.completedHours / goal.targetHours) * 100);
                    var statusText = goal.isCompleted ? '✅ 已完成' : '⏳ 学习中';
                    var statusClass = goal.isCompleted ? 'completed-badge' : 'bg-surface-variant text-on-surface-variant';

                    var earnedBonus = Math.min(goal.bonus, (goal.completedHours / goal.targetHours) * goal.bonus);
                    var isFullyEarned = goal.isCompleted || earnedBonus >= goal.bonus - 0.001;

                    html += `
                        <div class="bg-surface-container-lowest rounded-xl p-5 shadow-[0_10px_30px_rgba(0,0,0,0.04)] flex flex-col gap-3 animate-fade-in-up">
                            <div class="flex justify-between items-start">
                                <div>
                                    <h4 class="font-body-lg text-body-lg text-primary font-medium">${goal.skillName}</h4>
                                    <div class="flex items-center gap-2 mt-1 flex-wrap">
                                        <span class="font-label-sm text-label-sm text-on-surface-variant">目标 ${goal.targetHours}h</span>
                                        <span class="font-label-sm text-label-sm text-on-surface-variant">·</span>
                                        <span class="font-label-sm text-label-sm text-on-tertiary-container">已学 ${goal.completedHours.toFixed(1)}h</span>
                                        <span class="font-label-sm text-label-sm text-tertiary-fixed-dim font-bold">
                                            ${isFullyEarned ? '✅ +' + goal.bonus : '+' + earnedBonus.toFixed(2) + '/' + goal.bonus} 元/时
                                        </span>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2">
                                    <span class="${statusClass} px-3 py-0.5 text-xs rounded-full">${statusText}</span>
                                    <button class="delete-goal-btn text-on-surface-variant hover:text-error transition-colors p-1" data-index="${index}" aria-label="删除">
                                        <span class="material-symbols-outlined text-[18px]">close</span>
                                    </button>
                                </div>
                            </div>
                            <div class="h-[3px] w-full bg-surface-container-high overflow-hidden rounded-full">
                                <div class="h-full ${goal.isCompleted ? 'bg-tertiary-fixed-dim' : 'bg-on-tertiary-container'} transition-all duration-700 ease-out" style="width:${progress}%"></div>
                            </div>
                            ${goal.isCompleted ? `<p class="font-label-sm text-label-sm text-tertiary-fixed-dim">✅ 已完成！累计获得 +${goal.bonus} 元/小时加薪 🎉</p>` : `<p class="font-label-sm text-label-sm text-on-surface-variant/50">📈 学多少，加多少！已获得 +${earnedBonus.toFixed(2)} 元/小时</p>`}
                        </div>
                    `;
                });

                container.innerHTML = html;
            }

            // ============================================================
            // 4. 更新总额显示 & 下拉列表
            // ============================================================

            function updateTotalBonusDisplay() {
                totalBonus = recalcTotalBonus();
                var el = document.getElementById('total-bonus-display');
                el.textContent = '+¥' + totalBonus.toFixed(2);
                el.classList.remove('bonus-pop');
                void el.offsetWidth;
                el.classList.add('bonus-pop');
            }
            updateTotalBonusDisplay();

            function populateGoalSelect() {
                var select = document.getElementById('timer-goal-select');
                select.innerHTML = '';
                var hasAvailable = false;
                goals.forEach(function(goal, index) {
                    if (!goal.isCompleted) {
                        var option = document.createElement('option');
                        option.value = index;
                        option.textContent = goal.skillName + '（' + goal.completedHours.toFixed(1) + '/' + goal.targetHours + 'h）';
                        select.appendChild(option);
                        hasAvailable = true;
                    }
                });
                if (!hasAvailable) {
                    var placeholder = document.createElement('option');
                    placeholder.value = '';
                    placeholder.textContent = '🎉 所有目标已完成！';
                    select.appendChild(placeholder);
                }
                if (selectedGoalIndex !== null && selectedGoalIndex < goals.length) {
                    var goal = goals[selectedGoalIndex];
                    if (goal && !goal.isCompleted) {
                        select.value = selectedGoalIndex;
                    } else {
                        selectedGoalIndex = null;
                        timerState.selectedGoalIndex = null;
                        saveTimerState(timerState);
                    }
                }
            }

            // ============================================================
            // 5. 操作函数：添加 / 删除
            // ============================================================

            var skillRefs = [
                { name: '编程入门', hours: '40-80' },
                { name: '前端/后端开发', hours: '200-500' },
                { name: '英语流利', hours: '300-800' },
                { name: '乐器入门', hours: '50-100' },
                { name: '写作/文案', hours: '30-80' },
                { name: '数据分析/SQL', hours: '30-60' },
                { name: '平面设计', hours: '80-150' }
            ];

            function addGoal(skillName, targetHours, bonus) {
                var newGoal = {
                    id: Date.now(),
                    skillName: skillName.trim(),
                    targetHours: targetHours,
                    completedHours: 0,
                    bonus: bonus,
                    isCompleted: false
                };
                goals.push(newGoal);
                saveGoals(goals);
                recalcTotalBonus();
                updateTotalBonusDisplay();
                renderGoals();
                populateGoalSelect();
            }

            // deleteGoal 使用 showConfirm
            async function deleteGoal(index) {
                if (index < 0 || index >= goals.length) return;
                var goal = goals[index];
                if (goal.isCompleted) {
                    if (!await showConfirm('删除确认', '该目标已完成，删除后将失去 +' + goal.bonus + ' 元/小时的加薪，确定吗？')) return;
                } else {
                    if (!await showConfirm('删除确认', '确定要删除「' + goal.skillName + '」吗？')) return;
                }
                if (selectedGoalIndex === index) {
                    selectedGoalIndex = null;
                    timerState.selectedGoalIndex = null;
                    saveTimerState(timerState);
                    progressBonusWrapper.style.display = 'none';
                }
                goals.splice(index, 1);
                saveGoals(goals);
                recalcTotalBonus();
                updateTotalBonusDisplay();
                renderGoals();
                populateGoalSelect();
            }

            // ============================================================
            // 6. 事件绑定
            // ============================================================

            document.getElementById('btn-add-goal').addEventListener('click', async function() {
                var skill = await showPrompt('新建目标', '请输入要学习的技能名称', '如：Python 编程');
                if (skill === null || skill.trim() === '') return;

                var refMsg = '📚 常见技能参考时长：\n';
                skillRefs.forEach(function(r) {
                    refMsg += '  • ' + r.name + ': ' + r.hours + ' 小时\n';
                });
                refMsg += '\n请设定你的目标学习时长（小时）:';

                var hoursStr = await showPrompt('新建目标', refMsg, '如：40');
                if (hoursStr === null) return;
                var hours = parseFloat(hoursStr);
                if (isNaN(hours) || hours <= 0) {
                    await showAlert('提示', '请输入有效的小时数');
                    return;
                }

                var bonusStr = await showPrompt('新建目标', '达成目标后，时薪增加多少元？', '如：5');
                if (bonusStr === null) return;
                var bonus = parseFloat(bonusStr);
                if (isNaN(bonus) || bonus <= 0) {
                    await showAlert('提示', '请输入有效的加薪金额');
                    return;
                }

                addGoal(skill.trim(), hours, bonus);
                await showAlert('✅ 已创建', '学习目标已创建！\n' + skill.trim() + ' | ' + hours + 'h | +' + bonus +
                    '元/时\n\n💡 学多少加多少，每分每秒都在涨薪！');
            });

            document.getElementById('goals-container').addEventListener('click', function(e) {
                var deleteBtn = e.target.closest('.delete-goal-btn');
                if (deleteBtn) {
                    var index = parseInt(deleteBtn.dataset.index, 10);
                    if (!isNaN(index)) deleteGoal(index);
                }
            });

            // ============================================================
            // 7. 恢复计时器状态
            // ============================================================

            function restoreTimerState() {
                var state = loadTimerState();
                timerSeconds = state.seconds || 0;
                isTimerRunning = state.isRunning || false;
                selectedGoalIndex = state.selectedGoalIndex !== undefined ? state.selectedGoalIndex : null;

                updateTimerDisplay();
                updateProgressBonus();

                if (isTimerRunning) {
                    var lastUpdate = state.lastUpdateTime;
                    if (lastUpdate) {
                        var elapsed = Math.floor((Date.now() - lastUpdate) / 1000);
                        if (elapsed > 0 && elapsed < 3600) {
                            timerSeconds += elapsed;
                            timerState.seconds = timerSeconds;
                            saveTimerState(timerState);
                        }
                    }
                    startBtn.innerHTML = '<span class="material-symbols-outlined text-[28px]">pause</span>';
                    startBtn.classList.add('timer-running');
                    isTimerRunning = true;
                    timerState.isRunning = true;
                    saveTimerState(timerState);

                    if (timerInterval) clearInterval(timerInterval);
                    timerInterval = setInterval(function() {
                        timerSeconds++;
                        updateTimerDisplay();
                    }, 1000);
                }

                populateGoalSelect();
                if (selectedGoalIndex !== null && selectedGoalIndex < goals.length) {
                    var goal = goals[selectedGoalIndex];
                    if (goal && !goal.isCompleted) {
                        goalSelect.value = selectedGoalIndex;
                    }
                }
            }

            // ============================================================
            // 8. 首次渲染 & 跨页面同步
            // ============================================================

            renderGoals();
            populateGoalSelect();
            restoreTimerState();

            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    var freshGoals = loadGoals();
                    var changed = false;
                    if (freshGoals.length !== goals.length) changed = true;
                    else {
                        for (var i = 0; i < freshGoals.length; i++) {
                            if (freshGoals[i].completedHours !== goals[i].completedHours ||
                                freshGoals[i].isCompleted !== goals[i].isCompleted) {
                                changed = true;
                                break;
                            }
                        }
                    }
                    if (changed) {
                        goals = freshGoals;
                        recalcTotalBonus();
                        updateTotalBonusDisplay();
                        renderGoals();
                        populateGoalSelect();
                    }
                    updateProgressBonus();
                }
            });

            window.addEventListener('beforeunload', function() {
                timerState.seconds = timerSeconds;
                timerState.isRunning = isTimerRunning;
                timerState.selectedGoalIndex = selectedGoalIndex;
                timerState.lastUpdateTime = Date.now();
                saveTimerState(timerState);
            });

        });
    </script>
</body>
</html>

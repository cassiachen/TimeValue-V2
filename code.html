        .pt-safe { padding-top: env(safe-area-inset-top, 24px); }

            from { opacity: 0; transform: translateY(12px); }

<body class="bg-background text-on-background font-body-lg text-body-lg min-h-screen antialiased flex flex-col">
<!-- Shared Component: TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-page h-14 bg-surface text-primary pt-safe">
<button class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full hover:bg-surface-container transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined text-primary text-[24px]">menu</span>
</button>
<h1 class="font-headline-md text-headline-md-mobile md:text-headline-md font-bold tracking-tight text-primary absolute left-1/2 -translate-x-1/2">
            时值 TimeValue
        </h1>
<div class="w-10"></div> <!-- Placeholder for optical balance -->
</header>
<!-- Main Canvas -->
<main class="flex-1 px-margin-page pt-28 pb-32 flex flex-col gap-stack-lg max-w-md mx-auto w-full">
<!-- Header & Hero Value -->
<section class="flex flex-col gap-stack-sm animate-fade-in-up">
<h2 class="font-body-md text-body-md text-on-surface-variant uppercase tracking-wider">时间价值</h2>
<div class="flex items-baseline gap-2">
<span class="font-display-lg text-display-lg text-primary" id="hourly-wage-display">¥56.82</span>
<span class="font-body-md text-body-md text-on-surface-variant">/ 小时</span>
</div>
<div class="h-[1px] w-12 bg-primary/10 mt-2"></div>
</section>
<!-- Life Price List Section -->
<section class="flex flex-col gap-stack-md animate-fade-in-up" style="animation-delay: 0.1s;">
<div class="flex items-center justify-between mb-2">
<h3 class="font-headline-md-mobile text-headline-md-mobile text-primary">人生价格表</h3>
</div>
<div class="flex flex-col gap-stack-md w-full" id="items-container">
<!-- Example Item Card -->
<div class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_10px_30px_rgba(0,0,0,0.04)] flex flex-col gap-stack-md transition-transform active:scale-[0.98] duration-300" id="example-item-card"><div class="flex justify-between items-start"><h4 class="font-body-lg text-body-lg text-primary font-medium">iPhone 15 Pro</h4><span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container px-2 py-1 rounded item-price">¥8,999</span></div><div class="bg-surface-bright rounded-lg p-4 flex flex-col gap-1 border border-surface-variant/50"><div class="flex items-baseline gap-2"><span class="font-body-md text-body-md text-on-surface-variant">需要工作</span><span class="font-headline-md-mobile text-headline-md-mobile text-primary tracking-tight req-hours">159</span><span class="font-body-md text-body-md text-on-surface-variant">小时</span></div><p class="font-label-sm text-label-sm text-on-surface-variant opacity-80 flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">calendar_today</span>约 <span class="req-days">20</span> 个工作日</p></div></div>
</div>
<!-- Add New Item Button -->
<button class="w-full flex items-center justify-center p-6 border border-dashed border-outline-variant rounded-xl bg-transparent hover:bg-surface-container-low text-on-surface-variant transition-colors active:scale-[0.98] duration-200 mt-2 gap-2" id="btn-add-item">
<span class="material-symbols-outlined">add</span>
<span class="font-body-md text-body-md">添加新目标</span>
</button>
</section>
</main>
<!-- Shared Component: BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-page py-4 pb-safe bg-surface/95 backdrop-blur-md shadow-[0_-10px_30px_rgba(0,0,0,0.04)] rounded-t-xl">
<!-- Inactive Tab -->
<a class="flex flex-col items-center justify-center text-outline transition-transform duration-300 ease-out hover:text-primary active:scale-95" href="/salary">
<span class="material-symbols-outlined text-[24px] mb-1">payments</span>
<span class="font-label-sm text-label-sm">工资</span>
</a>
<!-- Active Tab (Semantic Match: "Time" -> "时间") -->
<a class="flex flex-col items-center justify-center text-primary font-bold transition-transform duration-300 ease-out scale-[1.02]" href="/time">
<span class="material-symbols-outlined text-[24px] mb-1" style="font-variation-settings: 'FILL' 1;">schedule</span>
<span class="font-label-sm text-label-sm">时间</span>
</a>
<!-- Inactive Tab -->
<a class="flex flex-col items-center justify-center text-outline transition-transform duration-300 ease-out hover:text-primary active:scale-95" href="/life">
<span class="material-symbols-outlined text-[24px] mb-1">auto_awesome</span>
<span class="font-label-sm text-label-sm">人生</span>
</a>
</nav>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // 1. Retrieve data from localStorage (or defaults)
        const salary = parseFloat(localStorage.getItem('salary') || '10000');
        const workDays = parseFloat(localStorage.getItem('workDays') || '22');
        const workHours = parseFloat(localStorage.getItem('workHours') || '8');

        // 2. Calculate Hourly Wage
        const hourlyWage = salary / (workDays * workHours);
        document.getElementById('hourly-wage-display').innerText = `¥${hourlyWage.toFixed(2)}`;

        // Function to update a card's calculations based on its price
        function updateCardCalculations(card) {
            const priceText = card.querySelector('.item-price').innerText.replace(/[^\d.-]/g, '');
            const price = parseFloat(priceText);
            if (isNaN(price)) return;

            const reqHours = price / hourlyWage;
            const reqDays = reqHours / workHours;

            card.querySelector('.req-hours').innerText = Math.ceil(reqHours);
            card.querySelector('.req-days').innerText = Math.ceil(reqDays);
        }

        // Initialize existing example card
        const exampleCard = document.getElementById('example-item-card');
        if (exampleCard) {
            updateCardCalculations(exampleCard);
        }

        // 3. Handle adding new items
        document.getElementById('btn-add-item').addEventListener('click', () => {
            const name = prompt("请输入物品名称 (如: MacBook Pro):");
            if (!name) return;
            const priceStr = prompt("请输入物品价格 (如: 12999):");
            if (!priceStr) return;
            
            const price = parseFloat(priceStr);
            if (isNaN(price)) {
                alert("请输入有效的数字价格");
                return;
            }

            const reqHours = price / hourlyWage;
            const reqDays = reqHours / workHours;

            const newCardHTML = `
                <div class="bg-surface-container-lowest rounded-xl p-6 shadow-[0_10px_30px_rgba(0,0,0,0.04)] flex flex-col gap-stack-md transition-transform active:scale-[0.98] duration-300 animate-fade-in-up">
                    <div class="flex justify-between items-start">
                        <h4 class="font-body-lg text-body-lg text-primary font-medium">${name}</h4>
                        <span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container px-2 py-1 rounded item-price">¥${price.toLocaleString()}</span>
                    </div>
                    <div class="bg-surface-bright rounded-lg p-4 flex flex-col gap-1 border border-surface-variant/50">
                        <div class="flex items-baseline gap-2">
                            <span class="font-body-md text-body-md text-on-surface-variant">需要工作</span>
                            <span class="font-headline-md-mobile text-headline-md-mobile text-primary tracking-tight req-hours">${Math.ceil(reqHours)}</span>
                            <span class="font-body-md text-body-md text-on-surface-variant">小时</span>
                        </div>
                        <p class="font-label-sm text-label-sm text-on-surface-variant opacity-80 flex items-center gap-1">
                            <span class="material-symbols-outlined text-[14px]">calendar_today</span>
                            约 <span class="req-days">${Math.ceil(reqDays)}</span> 个工作日
                        </p>
                    </div>
                </div>
            `;
            
            document.getElementById('items-container').insertAdjacentHTML('beforeend', newCardHTML);
        });
    });
</script>


</body></html>

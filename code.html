<!DOCTYPE html>

<style>
        body { -webkit-tap-highlight-color: transparent; }
        /* Hide scrollbar for clean aesthetic */
        ::-webkit-scrollbar { display: none; }
        
        /* Custom Input Underline Animation */
        .input-wrapper::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 1px;
            background-color: theme('colors.primary');
            transition: width 0.3s ease;
        }
        .input-wrapper:focus-within::after {
            width: 100%;
        }
    </style>

<body class="bg-surface-container-lowest text-on-surface antialiased min-h-screen">
<!-- TopAppBar (Shared Component) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-page h-14 bg-surface-container-lowest flat no shadows">
<button class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="menu">menu</span>
</button>
<div class="font-headline-md text-headline-md-mobile font-bold tracking-tight text-primary">
            时值 TimeValue
        </div>
<div class="w-6"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<!-- Navigation Shell Suppressed: This is an onboarding/setup screen (Linear/Transactional intent). -->
<main class="pt-[80px] pb-[120px] px-margin-page max-w-md mx-auto">
<!-- Header -->
<div class="mb-stack-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary tracking-tight">
                构建你的时间基准线
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-stack-sm">
                通过量化你的基础投入，计算出你时间的真实价值。
            </p>
</div>
<!-- Form: Basic Info -->
<section class="flex flex-col gap-stack-md mb-stack-lg">
<div class="relative group input-wrapper pb-unit">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-unit transition-colors group-focus-within:text-primary flex items-center gap-2">
                    月薪 (Monthly Salary)
                </label>
<div class="flex items-center">
<span class="font-body-lg text-body-lg text-on-surface-variant mr-2">¥</span>
<input class="w-full bg-transparent border-0 border-b border-surface-variant focus:ring-0 px-0 py-stack-sm font-body-lg text-body-lg text-primary transition-colors placeholder:text-outline-variant outline-none" id="monthlySalary" placeholder="0.00" type="number"/>
</div>
</div>
<div class="relative group input-wrapper pb-unit">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-unit transition-colors group-focus-within:text-primary">
                    每月工作天数 (Work days per month)
                </label>
<div class="flex items-center">
<input class="w-full bg-transparent border-0 border-b border-surface-variant focus:ring-0 px-0 py-stack-sm font-body-lg text-body-lg text-primary transition-colors placeholder:text-outline-variant outline-none" id="workDays" placeholder="22" type="number"/>
<span class="font-body-lg text-body-lg text-on-surface-variant ml-2">天</span>
</div>
</div>
<div class="grid grid-cols-2 gap-gutter-card">
<div class="relative group input-wrapper pb-unit">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-unit transition-colors group-focus-within:text-primary">
                        上班时间
                    </label>
<input class="w-full bg-transparent border-0 border-b border-surface-variant focus:ring-0 px-0 py-stack-sm font-body-lg text-body-lg text-primary transition-colors outline-none" id="workStart" type="time" value="09:00"/>
</div>
<div class="relative group input-wrapper pb-unit">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-unit transition-colors group-focus-within:text-primary">
                        下班时间
                    </label>
<input class="w-full bg-transparent border-0 border-b border-surface-variant focus:ring-0 px-0 py-stack-sm font-body-lg text-body-lg text-primary transition-colors outline-none" id="workEnd" type="time" value="18:00"/>
</div>
</div>
<div class="relative group input-wrapper pb-unit">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-unit transition-colors group-focus-within:text-primary">
                    午休时间 (Lunch break)
                </label>
<div class="flex items-center">
<input class="w-full bg-transparent border-0 border-b border-surface-variant focus:ring-0 px-0 py-stack-sm font-body-lg text-body-lg text-primary transition-colors placeholder:text-outline-variant outline-none" id="lunchBreak" placeholder="1.5" step="0.5" type="number"/>
<span class="font-body-lg text-body-lg text-on-surface-variant ml-2">小时</span>
</div>
</div>
<div class="grid grid-cols-2 gap-gutter-card">
<div class="relative group input-wrapper pb-unit">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-unit transition-colors group-focus-within:text-primary">
                        当前年龄 (Current Age)
                    </label>
<div class="flex items-center">
<input class="w-full bg-transparent border-0 border-b border-surface-variant focus:ring-0 px-0 py-stack-sm font-body-lg text-body-lg text-primary transition-colors placeholder:text-outline-variant outline-none" id="currentAge" placeholder="25" type="number"/>
<span class="font-body-lg text-body-lg text-on-surface-variant ml-2">岁</span>
</div>
</div>
<div class="relative group input-wrapper pb-unit">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-unit transition-colors group-focus-within:text-primary">
                        预期寿命 (Expected Life)
                    </label>
<div class="flex items-center">
<input class="w-full bg-transparent border-0 border-b border-surface-variant focus:ring-0 px-0 py-stack-sm font-body-lg text-body-lg text-primary transition-colors placeholder:text-outline-variant outline-none" id="expectedLife" type="number" value="80"/>
<span class="font-body-lg text-body-lg text-on-surface-variant ml-2">岁</span>
</div>
</div>
</div>
</section>
<!-- Section: Fixed Expenses -->
<section class="mt-stack-lg">
<h2 class="font-headline-md text-headline-md text-primary mb-stack-md flex items-center gap-2">
                固定支出
            </h2>
<div class="flex flex-col gap-stack-md">
<div class="relative group input-wrapper pb-unit">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-unit transition-colors group-focus-within:text-primary flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]" data-icon="home">home</span> 房租/房贷 (Rent)
                    </label>
<div class="flex items-center">
<span class="font-body-lg text-body-lg text-on-surface-variant mr-2">¥</span>
<input class="w-full bg-transparent border-0 border-b border-surface-variant focus:ring-0 px-0 py-stack-sm font-body-lg text-body-lg text-primary transition-colors placeholder:text-outline-variant outline-none" id="rentExpense" placeholder="0.00" type="number"/>
</div>
</div>
<div class="relative group input-wrapper pb-unit">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-unit transition-colors group-focus-within:text-primary flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]" data-icon="directions_subway">directions_subway</span> 通勤 (Commute)
                    </label>
<div class="flex items-center">
<span class="font-body-lg text-body-lg text-on-surface-variant mr-2">¥</span>
<input class="w-full bg-transparent border-0 border-b border-surface-variant focus:ring-0 px-0 py-stack-sm font-body-lg text-body-lg text-primary transition-colors placeholder:text-outline-variant outline-none" id="commuteExpense" placeholder="0.00" type="number"/>
</div>
</div>
<div class="relative group input-wrapper pb-unit">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-unit transition-colors group-focus-within:text-primary flex items-center gap-2">
<span class="material-symbols-outlined text-[16px]" data-icon="restaurant">restaurant</span> 三餐 (Meals)
                    </label>
<div class="flex items-center">
<span class="font-body-lg text-body-lg text-on-surface-variant mr-2">¥</span>
<input class="w-full bg-transparent border-0 border-b border-surface-variant focus:ring-0 px-0 py-stack-sm font-body-lg text-body-lg text-primary transition-colors placeholder:text-outline-variant outline-none" id="mealsExpense" placeholder="0.00" type="number"/>
</div>
</div>
</div>
</section>
<!-- Primary Action Button -->
<div class="fixed bottom-0 left-0 w-full p-margin-page pb-10 bg-gradient-to-t from-surface-container-lowest via-surface-container-lowest to-transparent md:relative md:p-0 md:mt-stack-lg md:bg-none z-10">
<button class="w-full h-[52px] bg-primary text-on-primary font-body-md text-body-md rounded-[16px] flex items-center justify-center font-medium shadow-[0_10px_30px_rgba(0,0,0,0.04)] active:scale-[0.98] transition-transform duration-200" id="saveBtn">
                开始计算
                <span class="material-symbols-outlined ml-2 text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</main>
<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Load existing data if available
        const existingData = localStorage.getItem('timeValueData');
        if (existingData) {
            try {
                const data = JSON.parse(existingData);
                document.getElementById('monthlySalary').value = data.monthlySalary || '';
                document.getElementById('workDays').value = data.workDays || '22';
                document.getElementById('workStart').value = data.workStart || '09:00';
                document.getElementById('workEnd').value = data.workEnd || '18:00';
                document.getElementById('lunchBreak').value = data.lunchBreak || '1.5';
                document.getElementById('currentAge').value = data.currentAge || '';
                document.getElementById('expectedLife').value = data.expectedLife || '80';
                document.getElementById('rentExpense').value = data.rentExpense || '';
                document.getElementById('commuteExpense').value = data.commuteExpense || '';
                document.getElementById('mealsExpense').value = data.mealsExpense || '';
            } catch (e) {
                console.error("Error parsing saved data", e);
            }
        }

        document.getElementById('saveBtn').addEventListener('click', () => {
            const data = {
                monthlySalary: document.getElementById('monthlySalary').value,
                workDays: document.getElementById('workDays').value,
                workStart: document.getElementById('workStart').value,
                workEnd: document.getElementById('workEnd').value,
                lunchBreak: document.getElementById('lunchBreak').value,
                currentAge: document.getElementById('currentAge').value,
                expectedLife: document.getElementById('expectedLife').value,
                rentExpense: document.getElementById('rentExpense').value,
                commuteExpense: document.getElementById('commuteExpense').value,
                mealsExpense: document.getElementById('mealsExpense').value
            };
            
            localStorage.setItem('timeValueData', JSON.stringify(data));
            
            // Redirect to Wage screen (assuming wage.html or similar in standard setup)
            // Using a generic hash or placeholder redirect as specific file isn't defined
            window.location.href = 'wage.html'; 
        });
    });
</script>
</body></html>

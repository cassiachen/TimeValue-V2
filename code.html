<button aria-label="Menu" class="text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 duration-200 p-2 -ml-2">

<h1 class="font-headline-md text-headline-md-mobile md:text-headline-md font-bold tracking-tight text-primary">时值 TimeValue</h1>
<div class="w-10"></div> <!-- Balancer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-2xl mx-auto pt-24 pb-32 px-margin-page flex flex-col gap-stack-lg relative z-0">
<!-- Hero Section -->
<section class="flex flex-col gap-unit mt-stack-md">
<h2 class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-widest">人生余额 (天)</h2>
<div class="font-display-lg text-display-lg text-primary tabular-nums tracking-tight animate-fade-in-up" id="life-balance-days">
                --
            </div>
<p class="font-body-md text-body-md text-on-surface-variant opacity-70 mt-2" id="expected-life-text">
                基于 80 岁预期寿命
            </p>
</section>
<!-- Timeline Progress Series -->
<section class="flex flex-col gap-6 mt-stack-lg w-full">
<!-- Progress Item: Today -->
<div class="flex flex-col gap-3 group">
<div class="flex justify-between items-end">
<span class="font-label-sm text-label-sm text-primary">今日</span>
<span class="font-body-md text-body-md text-on-surface-variant tabular-nums" id="today-percent">--%</span>
</div>
<div class="h-[3px] w-full bg-surface-container-high overflow-hidden">
<div class="h-full bg-on-tertiary-container w-[0%] transition-all duration-1000 ease-out origin-left" id="today-bar"></div>
</div>
</div>
<!-- Progress Item: Month -->
<div class="flex flex-col gap-3 group">
<div class="flex justify-between items-end">
<span class="font-label-sm text-label-sm text-primary">本月</span>
<span class="font-body-md text-body-md text-on-surface-variant tabular-nums" id="month-percent">--%</span>
</div>
<div class="h-[3px] w-full bg-surface-container-high overflow-hidden">
<div class="h-full bg-on-tertiary-container w-[0%] transition-all duration-1000 ease-out origin-left delay-100" id="month-bar"></div>
</div>
</div>
<!-- Progress Item: Year -->
<div class="flex flex-col gap-3 group">
<div class="flex justify-between items-end">
<span class="font-label-sm text-label-sm text-primary">今年</span>
<span class="font-body-md text-body-md text-on-surface-variant tabular-nums" id="year-percent">--%</span>
</div>
<div class="h-[3px] w-full bg-surface-container-high overflow-hidden">
<div class="h-full bg-on-tertiary-container w-[0%] transition-all duration-1000 ease-out origin-left delay-200" id="year-bar"></div>
</div>
</div>

<style>
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
<script>
    function updateProgress() {
        // 1. Data Input
        const currentAge = parseFloat(localStorage.getItem('currentAge')) || 23; // Default 23 if not set
        const expectedLife = parseFloat(localStorage.getItem('expectedLife')) || 80;

        // 2. Calculations
        const now = new Date();
        
        // Today
        const startOfDay = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const todayPassed = now - startOfDay;
        const todayTotal = 24 * 60 * 60 * 1000;
        const todayPercent = (todayPassed / todayTotal) * 100;

        // Month
        const startOfMonth = new Date(now.getFullYear(), now.getMonth(), 1);
        const nextMonth = new Date(now.getFullYear(), now.getMonth() + 1, 1);
        const monthPassed = now - startOfMonth;
        const monthTotal = nextMonth - startOfMonth;
        const monthPercent = (monthPassed / monthTotal) * 100;

        // Year
        const startOfYear = new Date(now.getFullYear(), 0, 1);
        const nextYear = new Date(now.getFullYear() + 1, 0, 1);
        const yearPassed = now - startOfYear;
        const yearTotal = nextYear - startOfYear;
        const yearPercent = (yearPassed / yearTotal) * 100;

        // Life
        const lifePercent = (currentAge / expectedLife) * 100;
        const remainingDays = Math.max(0, (expectedLife - currentAge) * 365);

        // 3. Update DOM
        document.getElementById('life-balance-days').textContent = Math.floor(remainingDays).toLocaleString();
        document.getElementById('expected-life-text').textContent = `基于 ${expectedLife} 岁预期寿命`;

        document.getElementById('today-percent').textContent = todayPercent.toFixed(1) + '%';
        document.getElementById('today-bar').style.width = todayPercent + '%';

        document.getElementById('month-percent').textContent = monthPercent.toFixed(1) + '%';
        document.getElementById('month-bar').style.width = monthPercent + '%';

        document.getElementById('year-percent').textContent = yearPercent.toFixed(1) + '%';
        document.getElementById('year-bar').style.width = yearPercent + '%';

        document.getElementById('life-percent').textContent = lifePercent.toFixed(1) + '%';
        document.getElementById('life-bar').style.width = lifePercent + '%';
    }

    // Initialize and run periodically
    updateProgress();
    setInterval(updateProgress, 60000); // Update every minute
</script>

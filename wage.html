<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport" />
    <title>时值 TimeValue - 工资</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries">
    </script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-container": "#e0dfe4",
                        "surface-bright": "#f9f9fb",
                        "tertiary-fixed-dim": "#4edea3",
                        "on-tertiary": "#ffffff",
                        "outline": "#77767b",
                        "inverse-surface": "#2f3132",
                        "secondary-fixed": "#e3e2e7",
                        "tertiary-fixed": "#6ffbbe",
                        "on-surface-variant": "#46464a",
                        "on-tertiary-fixed-variant": "#005236",
                        "secondary": "#5e5e63",
                        "outline-variant": "#c7c6ca",
                        "on-secondary-container": "#626267",
                        "on-secondary-fixed": "#1a1b1f",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#c8c6c8",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e2e2e4",
                        "surface-container": "#eeeef0",
                        "error": "#ba1a1a",
                        "primary": "#030304",
                        "on-primary-fixed": "#1b1b1d",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#c8c6c8",
                        "tertiary-container": "#002315",
                        "surface-tint": "#5f5e60",
                        "on-tertiary-container": "#009869",
                        "background": "#f9f9fb",
                        "secondary-fixed-dim": "#c7c6cb",
                        "primary-fixed": "#e4e2e4",
                        "on-primary-fixed-variant": "#474649",
                        "on-primary": "#ffffff",
                        "on-background": "#1a1c1d",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#002113",
                        "surface-container-high": "#e8e8ea",
                        "surface-container-highest": "#e2e2e4",
                        "inverse-on-surface": "#f0f0f2",
                        "surface": "#f9f9fb",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1a1c1d",
                        "on-secondary-fixed-variant": "#46464b",
                        "tertiary": "#000502",
                        "primary-container": "#1d1d1f",
                        "on-primary-container": "#868587",
                        "surface-container-low": "#f3f3f5",
                        "surface-dim": "#d9dadc"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "stack-md": "16px",
                        "unit": "4px",
                        "stack-sm": "8px",
                        "margin-page": "24px",
                        "stack-lg": "32px",
                        "gutter-card": "16px"
                    },
                    fontFamily: {
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    fontSize: {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "30px", "fontWeight": "600" }],
                        "label-sm": ["13px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
    <style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        ::-webkit-scrollbar {
            display: none;
        }
        @keyframes subtle-pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .animate-realtime {
            animation: subtle-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes roll-up {
            from {
                transform: translateY(10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .roll-in {
            animation: roll-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="bg-surface-container-lowest text-on-surface font-body-md min-h-screen flex flex-col pt-14 pb-[88px] selection:bg-tertiary-fixed selection:text-on-tertiary-fixed">
    <!-- TopAppBar -->
    <header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-page h-14 bg-surface-container-lowest">
        <button class="w-10 h-10 flex items-center justify-start text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 duration-200" onclick="window.location.href='settings.html'">
            <span class="material-symbols-outlined">menu</span>
        </button>
        <h1 class="font-headline-md text-headline-md-mobile font-bold tracking-tight text-primary absolute left-1/2 -translate-x-1/2">时值 TimeValue</h1>
        <div class="w-10 h-10"></div>
    </header>

    <main class="flex-1 px-margin-page flex flex-col mt-8">
        <!-- 今日已赚 -->
        <section class="flex flex-col items-center justify-center py-stack-lg mt-4 mb-stack-md">
            <div class="text-on-surface-variant font-label-sm text-label-sm uppercase tracking-widest mb-unit flex items-center gap-1">
                今日已赚
            </div>
            <div class="flex items-baseline gap-1 roll-in">
                <span class="font-headline-md text-headline-md text-primary translate-y-[-8px]">¥</span>
                <h2 class="font-display-lg text-display-lg text-primary tracking-tighter" id="hero-counter" style="font-size:72px;line-height:1;">0.00</h2>
            </div>
            <div class="mt-stack-sm flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-low text-on-tertiary-container font-label-sm text-label-sm">
                <span class="material-symbols-outlined text-[14px] animate-realtime" style="font-variation-settings:'FILL'1;">arrow_upward</span>
                实时增长中
            </div>
        </section>

        <!-- 今日已花 & 今日净值 -->
        <section class="grid grid-cols-2 gap-gutter-card mb-stack-lg">
            <div class="flex flex-col items-center justify-center p-stack-md bg-surface-container-low rounded-[20px]">
                <span class="text-on-surface-variant font-label-sm text-label-sm mb-1">今日已花</span>
                <span class="font-headline-md text-headline-md text-primary font-medium" id="today-expense">-¥0.00</span>
            </div>
            <div class="flex flex-col items-center justify-center p-stack-md bg-surface-container-low rounded-[20px]">
                <span class="text-on-surface-variant font-label-sm text-label-sm mb-1">今日净值</span>
                <span class="font-headline-md text-headline-md text-primary font-medium" id="net-value">¥0.00</span>
            </div>
        </section>

        <!-- 工作日进度 -->
        <section class="flex flex-col gap-unit mb-stack-lg">
            <div class="bg-surface-container-low rounded-[24px] p-6 flex flex-col relative overflow-hidden shadow-[0_10px_30px_rgba(0,0,0,0.02)]">
                <div class="flex justify-between items-end mb-4">
                    <span class="font-label-sm text-label-sm text-on-surface-variant">工作日进度</span>
                    <span class="font-headline-md text-headline-md-mobile text-primary" id="progress-percent">0%</span>
                </div>
                <div class="h-[2px] w-full bg-surface-variant rounded-full overflow-hidden">
                    <div class="h-full bg-on-tertiary-container w-[0%] transition-all duration-1000 ease-linear" id="progress-fill"></div>
                </div>
                <div class="mt-4 flex justify-between items-center text-on-surface-variant font-label-sm text-label-sm">
                    <div class="flex items-center gap-1.5" id="worked-time-text">
                        <span class="material-symbols-outlined text-[16px]">schedule</span>
                        已工作 00h 00m
                    </div>
                    <div class="flex items-center gap-1.5 text-on-surface" id="left-time-text">
                        00h 00m 距离下班
                    </div>
                </div>
            </div>
        </section>

        <!-- 时薪拆解 -->
        <section class="mt-auto mb-stack-lg px-2">
            <h3 class="font-label-sm text-label-sm text-on-surface-variant mb-stack-md px-2">时薪拆解</h3>
            <ul class="flex flex-col gap-4">
                <li class="flex justify-between items-center py-2 px-2 border-b border-surface-variant/50">
                    <span class="font-body-md text-body-md text-on-surface">时薪</span>
                    <span class="font-body-md text-body-md text-primary font-medium" id="hourly-wage">¥0.00</span>
                </li>
                <li class="flex justify-between items-center py-2 px-2 border-b border-surface-variant/50">
                    <span class="font-body-md text-body-md text-on-surface">分薪</span>
                    <span class="font-body-md text-body-md text-primary font-medium" id="minute-wage">¥0.00</span>
                </li>
                <li class="flex justify-between items-center py-2 px-2">
                    <span class="font-body-md text-body-md text-on-surface">秒薪</span>
                    <span class="font-body-md text-body-md text-on-surface-variant font-medium" id="second-wage">¥0.0000</span>
                </li>
            </ul>
        </section>
    </main>

    <!-- BottomNavBar -->
    <nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-page py-4 pb-safe bg-surface-container-lowest/95 backdrop-blur-md shadow-[0_-10px_30px_rgba(0,0,0,0.04)] rounded-t-xl md:hidden">
        <button class="flex flex-col items-center justify-center text-primary font-bold hover:opacity-80 transition-opacity active:scale-[1.02] duration-300 ease-out w-16 group" onclick="window.location.href='wage.html'">
            <div class="relative mb-1">
                <span class="material-symbols-outlined text-[24px]" style="font-variation-settings:'FILL'1;">payments</span>
                <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 w-1 h-1 bg-primary rounded-full"></div>
            </div>
            <span class="font-label-sm text-[11px] mt-1">工资</span>
        </button>
        <button class="flex flex-col items-center justify-center text-outline hover:text-primary transition-opacity active:scale-[1.02] duration-300 ease-out w-16" onclick="window.location.href='time.html'">
            <span class="material-symbols-outlined text-[24px] mb-1" style="font-variation-settings:'FILL'0;">schedule</span>
            <span class="font-label-sm text-[11px] mt-1">时间</span>
        </button>
        <button class="flex flex-col items-center justify-center text-outline hover:text-primary transition-opacity active:scale-[1.02] duration-300 ease-out w-16" onclick="window.location.href='life.html'">
            <span class="material-symbols-outlined text-[24px] mb-1" style="font-variation-settings:'FILL'0;">auto_awesome</span>
            <span class="font-label-sm text-[11px] mt-1">人生</span>
        </button>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ===== 读取数据 =====
            var data = null;
            var saved = localStorage.getItem('timeValueData');
            if (saved) {
                try {
                    data = JSON.parse(saved);
                } catch (e) {
                    console.warn('数据解析失败');
                }
            }

            // 默认值
            var salary = data && data.monthlySalary ? data.monthlySalary : 10000;
            var workDays = data && data.workDays ? data.workDays : 22;
            var workHoursPerDay = data && data.workHoursPerDay ? data.workHoursPerDay : 8;
            var monthlyExpenses = data && data.monthlyExpenses ? data.monthlyExpenses : 0;
            var workStart = data && data.workStart ? data.workStart : '09:00';
            var workEnd = data && data.workEnd ? data.workEnd : '18:00';
            var lunchBreak = data && data.lunchBreak ? data.lunchBreak : 1.5;

            // ===== 计算时薪 =====
            var totalWorkHoursPerMonth = workDays * workHoursPerDay;
            var hourlyWage = salary / totalWorkHoursPerMonth;
            var minuteWage = hourlyWage / 60;
            var secondWage = hourlyWage / 3600;

            // ===== DOM 引用 =====
            var heroCounter = document.getElementById('hero-counter');
            var todayExpenseEl = document.getElementById('today-expense');
            var netValueEl = document.getElementById('net-value');
            var progressPercentEl = document.getElementById('progress-percent');
            var progressFillEl = document.getElementById('progress-fill');
            var workedTimeTextEl = document.getElementById('worked-time-text');
            var leftTimeTextEl = document.getElementById('left-time-text');
            var hourlyWageEl = document.getElementById('hourly-wage');
            var minuteWageEl = document.getElementById('minute-wage');
            var secondWageEl = document.getElementById('second-wage');

            // 显示时薪拆解
            hourlyWageEl.textContent = '¥' + hourlyWage.toFixed(2);
            minuteWageEl.textContent = '¥' + minuteWage.toFixed(2);
            secondWageEl.textContent = '¥' + secondWage.toFixed(4);

            // ===== 解析时间 =====
            function parseTime(str) {
                var parts = str.split(':').map(Number);
                return { h: parts[0], m: parts[1], totalSeconds: parts[0] * 3600 + parts[1] * 60 };
            }
            var start = parseTime(workStart);
            var end = parseTime(workEnd);
            var lunchSeconds = (lunchBreak || 0) * 3600;
            var totalWorkSeconds = (end.totalSeconds - start.totalSeconds) - lunchSeconds;

            // ===== 每日支出（按月支出 / 工作天数）=====
            var dailyExpense = monthlyExpenses / workDays;

            // ===== 格式化时间 =====
            function formatDuration(seconds) {
                if (seconds < 0) seconds = 0;
                var h = Math.floor(seconds / 3600);
                var m = Math.floor((seconds % 3600) / 60);
                return String(h).padStart(2, '0') + 'h ' + String(m).padStart(2, '0') + 'm';
            }

            // ===== 更新函数 =====
            function update() {
                var now = new Date();
                var currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

                var workedSeconds = 0;

                if (currentSeconds <= start.totalSeconds) {
                    workedSeconds = 0;
                } else if (currentSeconds >= end.totalSeconds) {
                    workedSeconds = totalWorkSeconds;
                } else {
                    workedSeconds = currentSeconds - start.totalSeconds;
                    // 午餐扣除：假设午餐在中间时段
                    var midpoint = start.totalSeconds + (end.totalSeconds - start.totalSeconds) / 2;
                    if (currentSeconds > midpoint) {
                        workedSeconds -= lunchSeconds;
                    }
                }

                workedSeconds = Math.max(0, Math.min(workedSeconds, totalWorkSeconds));

                // 今日收入
                var earnedToday = workedSeconds * secondWage;

                // 今日支出（按比例）
                var expenseToday = (workedSeconds / totalWorkSeconds) * dailyExpense;
                if (currentSeconds >= end.totalSeconds) {
                    expenseToday = dailyExpense;
                }

                // 净值
                var netValue = earnedToday - expenseToday;

                // 进度
                var progress = totalWorkSeconds > 0 ? (workedSeconds / totalWorkSeconds) * 100 : 0;
                progress = Math.max(0, Math.min(100, progress));

                // 剩余时间
                var leftSeconds = totalWorkSeconds - workedSeconds;
                if (currentSeconds >= end.totalSeconds) {
                    leftSeconds = 0;
                }

                // 更新 DOM
                heroCounter.textContent = earnedToday.toFixed(2);
                todayExpenseEl.textContent = '-¥' + expenseToday.toFixed(2);
                netValueEl.textContent = '¥' + netValue.toFixed(2);

                progressPercentEl.textContent = progress.toFixed(0) + '%';
                progressFillEl.style.width = progress + '%';

                workedTimeTextEl.innerHTML =
                    '<span class="material-symbols-outlined text-[16px]">schedule</span> 已工作 ' + formatDuration(workedSeconds);
                leftTimeTextEl.textContent = formatDuration(leftSeconds) + ' 距离下班';

                // 微动效
                heroCounter.style.transform = 'scale(1.01)';
                setTimeout(function() {
                    heroCounter.style.transform = 'scale(1)';
                }, 100);
            }

            // 首次更新
            update();
            // 每秒更新
            setInterval(update, 1000);
        });
    </script>
</body>
</html>

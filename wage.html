    <style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        ::-webkit-scrollbar {
            display: none;
        }
        @keyframes subtle-pulse {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        .animate-realtime {
            animation: subtle-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes roll-up {
            from {
                transform: translateY(10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        .roll-in {
            animation: roll-up 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .bonus-detail-popup {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #ffffff;
            border-radius: 16px;
            padding: 16px 20px;
            min-width: 200px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            opacity: 0;
            transform: translateY(-8px) scale(0.95);
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }
        .bonus-detail-popup.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .bonus-detail-popup::before {
            content: '';
            position: absolute;
            top: -6px;
            right: 20px;
            width: 12px;
            height: 12px;
            background: #ffffff;
            transform: rotate(45deg);
            border-radius: 2px;
        }

        }
        .pt-safe {
            padding-top: env(safe-area-inset-top, 24px);
        }

            background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 100%);
            border: 1px solid #6ffbbe;
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .guide-card:hover {
            transform: scale(1.01);
            box-shadow: 0 4px 20px rgba(78, 222, 163, 0.2);
        }

            transform: scale(0.98);
        }

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // ============================================================
            // 1. 读取数据
            // ============================================================
            var data = null;
            var saved = localStorage.getItem('timeValueData');
            if (saved) {
                try {
                    data = JSON.parse(saved);
                } catch (e) {
                    console.warn('数据解析失败');
                }
            }

            var salary = data && data.monthlySalary ? data.monthlySalary : 10000;
            var workDays = data && data.workDays ? data.workDays : 22;
            var workHoursPerDay = data && data.workHoursPerDay ? data.workHoursPerDay : 8;
            var monthlyExpenses = data && data.monthlyExpenses ? data.monthlyExpenses : 0;

            var baseHourlyWage = salary / (workDays * workHoursPerDay);

            // ============================================================
            // 2. 学习加薪（假想，只展示）
            // ============================================================
            var learningBonus = 0;
            var completedGoals = [];
            var bonusStored = localStorage.getItem('learningTotalBonus');
            if (bonusStored) {
                try {
                    learningBonus = parseFloat(bonusStored) || 0;
                } catch (e) {}
            }
            var goalsStored = localStorage.getItem('learningGoals');
            if (goalsStored) {
                try {
                    var allGoals = JSON.parse(goalsStored);
                    completedGoals = allGoals.filter(function(g) { return g.isCompleted === true; });
                } catch (e) {}
            }

            // ============================================================
            // 3. 更新学习加薪标签（右上角）
            // ============================================================
            var bonusWrapper = document.getElementById('bonus-tag-wrapper');
            var bonusTagText = document.getElementById('bonus-tag-text');
            var bonusDetailList = document.getElementById('bonus-detail-list');
            var bonusDetailTotal = document.getElementById('bonus-detail-total');
            var popup = document.getElementById('bonus-detail-popup');
            var tagBtn = document.getElementById('bonus-tag-btn');

            if (learningBonus > 0 && completedGoals.length > 0) {
                bonusWrapper.style.display = 'block';
                bonusTagText.textContent = '+¥' + learningBonus.toFixed(2) + ' 学习加薪';

                var detailHtml = '';
                completedGoals.forEach(function(g) {
                    detailHtml += '<div class="flex justify-between items-center py-1 border-b border-surface-variant/20 last:border-0">' +
                        '<span class="text-on-surface">' + g.skillName + '</span>' +
                        '<span class="text-tertiary-fixed-dim font-medium">+¥' + g.bonus.toFixed(2) +
                        '/h</span>' +
                        '</div>';
                });
                bonusDetailList.innerHTML = detailHtml;
                bonusDetailTotal.textContent = '+¥' + learningBonus.toFixed(2);

                tagBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    popup.classList.toggle('show');
                });
                document.addEventListener('click', function() {
                    popup.classList.remove('show');
                });
                popup.addEventListener('click', function(e) {
                    e.stopPropagation();
                });
            } else {
                bonusWrapper.style.display = 'none';
            }

            // ============================================================
            // 4. 🆕 更新引导卡片
            // ============================================================
            var guideBonusCount = document.getElementById('guide-bonus-count');
            var guideTitle = document.getElementById('guide-title');
            var guideDesc = document.getElementById('guide-desc');
            var guideBadge = document.getElementById('guide-badge');

            if (learningBonus > 0) {
                guideTitle.textContent = '📈 继续学习，涨更多薪！';
                guideDesc.textContent = '已获得 +' + learningBonus.toFixed(2) + ' 元/小时学习加薪，继续加油！';
                guideBadge.textContent = '继续学习 →';
            } else {
                guideTitle.textContent = '📈 想让自己更值钱？';
                guideDesc.textContent = '学习新技能，给自己加薪！';
                guideBadge.textContent = '去学习 →';
            }
            guideBonusCount.textContent = learningBonus.toFixed(2);

            // 点击引导卡片跳转到学习页面
            document.getElementById('learn-guide-btn').addEventListener('click', function() {
                window.location.href = 'learn.html';
            });

            // ============================================================
            // 5. 时薪显示
            // ============================================================
            var hourlyWage = baseHourlyWage;
            document.getElementById('hourly-wage-display').textContent = '¥' + hourlyWage.toFixed(2);

            // ============================================================
            // 6. 计算
            // ============================================================
            var workStart = data && data.workStart ? data.workStart : '09:00';
            var workEnd = data && data.workEnd ? data.workEnd : '18:00';
            var lunchBreak = data && data.lunchBreak ? data.lunchBreak : 1.5;

            function parseTime(str) {
                var parts = str.split(':').map(Number);
                return { h: parts[0], m: parts[1], totalSeconds: parts[0] * 3600 + parts[1] * 60 };
            }
            var start = parseTime(workStart);
            var end = parseTime(workEnd);
            var lunchSeconds = (lunchBreak || 0) * 3600;
            var totalWorkSeconds = (end.totalSeconds - start.totalSeconds) - lunchSeconds;

            var dailyExpense = monthlyExpenses / workDays;

            // ============================================================
            // 7. DOM 引用
            // ============================================================
            var heroCounter = document.getElementById('hero-counter');
            var todayExpenseEl = document.getElementById('today-expense');
            var netValueEl = document.getElementById('net-value');
            var progressPercentEl = document.getElementById('progress-percent');
            var progressFillEl = document.getElementById('progress-fill');
            var workedTimeTextEl = document.getElementById('worked-time-text');
            var leftTimeTextEl = document.getElementById('left-time-text');
            var hourlyWageEl = document.getElementById('hourly-wage');
            var minuteWageEl = document.getElementById('minute-wage');
            var secondWageEl = document.getElementById('second-wage');

            var minuteWage = hourlyWage / 60;
            var secondWage = hourlyWage / 3600;

            hourlyWageEl.textContent = '¥' + hourlyWage.toFixed(2);
            minuteWageEl.textContent = '¥' + minuteWage.toFixed(2);
            secondWageEl.textContent = '¥' + secondWage.toFixed(4);

            function formatDuration(seconds) {
                if (seconds < 0) seconds = 0;
                var h = Math.floor(seconds / 3600);
                var m = Math.floor((seconds % 3600) / 60);
                return String(h).padStart(2, '0') + 'h ' + String(m).padStart(2, '0') + 'm';
            }

            function update() {
                var now = new Date();
                var currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

                var workedSeconds = 0;
                if (currentSeconds <= start.totalSeconds) {
                    workedSeconds = 0;
                } else if (currentSeconds >= end.totalSeconds) {
                    workedSeconds = totalWorkSeconds;
                } else {
                    workedSeconds = currentSeconds - start.totalSeconds;
                    var midpoint = start.totalSeconds + (end.totalSeconds - start.totalSeconds) / 2;
                    if (currentSeconds > midpoint) {
                        workedSeconds -= lunchSeconds;
                    }
                }
                workedSeconds = Math.max(0, Math.min(workedSeconds, totalWorkSeconds));

                var earnedToday = workedSeconds * secondWage;
                var expenseToday = (workedSeconds / totalWorkSeconds) * dailyExpense;
                if (currentSeconds >= end.totalSeconds) expenseToday = dailyExpense;
                var netValue = earnedToday - expenseToday;
                var progress = totalWorkSeconds > 0 ? (workedSeconds / totalWorkSeconds) * 100 : 0;
                progress = Math.max(0, Math.min(100, progress));
                var leftSeconds = totalWorkSeconds - workedSeconds;
                if (currentSeconds >= end.totalSeconds) leftSeconds = 0;

                heroCounter.textContent = earnedToday.toFixed(2);
                todayExpenseEl.textContent = '-¥' + expenseToday.toFixed(2);
                netValueEl.textContent = '¥' + netValue.toFixed(2);
                progressPercentEl.textContent = progress.toFixed(0) + '%';
                progressFillEl.style.width = progress + '%';
                workedTimeTextEl.innerHTML =
                    '<span class="material-symbols-outlined text-[16px]">schedule</span> 已工作 ' + formatDuration(workedSeconds);
                leftTimeTextEl.textContent = formatDuration(leftSeconds) + ' 距离下班';

                heroCounter.style.transform = 'scale(1.01)';
                setTimeout(function() { heroCounter.style.transform = 'scale(1)'; }, 100);
            }

            update();
            setInterval(update, 1000);

            // ============================================================
            // 8. 动画
            // ============================================================
            @keyframes fadeInUp {
                from {
                    opacity: 0;
                    transform: translateY(12px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            var style = document.createElement('style');
            style.textContent =
                '.animate-fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }';
            document.head.appendChild(style);

        });
    </script>
</body>
</html>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // ============================================================
            // 1. 读取数据
            // ============================================================
            var data = null;
            var saved = localStorage.getItem('timeValueData');
            if (saved) {
                try { data = JSON.parse(saved); } catch (e) { console.warn('数据解析失败'); }
            }

            var salary = data && data.monthlySalary ? data.monthlySalary : 10000;
            var workDays = data && data.workDays ? data.workDays : 22;
            var workHoursPerDay = data && data.workHoursPerDay ? data.workHoursPerDay : 8;
            var monthlyExpenses = data && data.monthlyExpenses ? data.monthlyExpenses : 0;

            var baseHourlyWage = salary / (workDays * workHoursPerDay);
            var minuteWageVal = baseHourlyWage / 60;
            var secondWageVal = baseHourlyWage / 3600;

            // ============================================================
            // 2. 学习加薪（只展示，不参与计算）
            // ============================================================
            var learningBonus = 0;
            var completedGoals = [];
            var bonusStored = localStorage.getItem('learningTotalBonus');
            if (bonusStored) {
                try { learningBonus = parseFloat(bonusStored) || 0; } catch (e) {}
            }
            var goalsStored = localStorage.getItem('learningGoals');
            if (goalsStored) {
                try {
                    var allGoals = JSON.parse(goalsStored);
                    completedGoals = allGoals.filter(function(g) { return g.isCompleted === true; });
                } catch (e) {}
            }

            // ============================================================
            // 3. 更新学习加薪标签
            // ============================================================
            var bonusWrapper = document.getElementById('bonus-tag-wrapper');
            var bonusTagText = document.getElementById('bonus-tag-text');
            var bonusDetailList = document.getElementById('bonus-detail-list');
            var bonusDetailTotal = document.getElementById('bonus-detail-total');
            var popup = document.getElementById('bonus-detail-popup');
            var tagBtn = document.getElementById('bonus-tag-btn');

            if (learningBonus > 0 && completedGoals.length > 0) {
                bonusWrapper.style.display = 'block';
                bonusTagText.textContent = '+¥' + learningBonus.toFixed(2);

                var detailHtml = '';
                completedGoals.forEach(function(g) {
                    detailHtml += '<div class="flex justify-between items-center py-1 border-b border-surface-variant/20 last:border-0">' +
                        '<span class="text-on-surface">' + g.skillName + '</span>' +
                        '<span class="text-tertiary-fixed-dim font-medium">+¥' + g.bonus.toFixed(2) + '/h</span>' +
                        '</div>';
                });
                bonusDetailList.innerHTML = detailHtml;
                bonusDetailTotal.textContent = '+¥' + learningBonus.toFixed(2);

                tagBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    popup.classList.toggle('show');
                });
                document.addEventListener('click', function() { popup.classList.remove('show'); });
                popup.addEventListener('click', function(e) { e.stopPropagation(); });
            } else {
                bonusWrapper.style.display = 'none';
            }

            // ============================================================
            // 4. 引导卡片
            // ============================================================
            var guideBonusCount = document.getElementById('guide-bonus-count');
            var guideTitle = document.getElementById('guide-title');
            var guideDesc = document.getElementById('guide-desc');
            var guideBadge = document.getElementById('guide-badge');

            if (learningBonus > 0) {
                guideTitle.textContent = '📈 继续学习，涨更多薪！';
                guideDesc.textContent = '已获得 +' + learningBonus.toFixed(2) + ' 元/小时学习加薪，继续加油！';
                guideBadge.textContent = '继续学习 →';
            } else {
                guideTitle.textContent = '📈 想让自己更值钱？';
                guideDesc.textContent = '学习新技能，给自己加薪！';
                guideBadge.textContent = '去学习 →';
            }
            if (document.getElementById('guide-bonus-count')) {
                document.getElementById('guide-bonus-count').textContent = learningBonus.toFixed(2);
            }

            document.getElementById('learn-guide-btn').addEventListener('click', function() {
                window.location.href = 'learn.html';
            });

            // ============================================================
            // 5. 核心逻辑：工作时间计算 + 每日收入存储
            // ============================================================
            var workStart = data && data.workStart ? data.workStart : '09:00';
            var workEnd = data && data.workEnd ? data.workEnd : '18:00';
            var lunchBreak = data && data.lunchBreak ? data.lunchBreak : 1.5;

            function parseTime(str) {
                var parts = str.split(':').map(Number);
                return { h: parts[0], m: parts[1], totalSeconds: parts[0] * 3600 + parts[1] * 60 };
            }
            var start = parseTime(workStart);
            var end = parseTime(workEnd);
            var lunchSeconds = (lunchBreak || 0) * 3600;
            var totalWorkSeconds = (end.totalSeconds - start.totalSeconds) - lunchSeconds;

            var dailyExpense = monthlyExpenses / workDays;

            // ----- 每日收入存储 -----
            var DAILY_EARNINGS_KEY = 'dailyEarningsHistory';

            function getTodayKey() {
                var d = new Date();
                return d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
            }

            function getYesterdayKey() {
                var d = new Date();
                d.setDate(d.getDate() - 1);
                return d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
            }

            function loadDailyEarnings() {
                var stored = localStorage.getItem(DAILY_EARNINGS_KEY);
                if (stored) {
                    try { return JSON.parse(stored); } catch (e) {}
                }
                return {};
            }

            function saveDailyEarnings(history) {
                localStorage.setItem(DAILY_EARNINGS_KEY, JSON.stringify(history));
            }

            // 保存今日收入到历史记录
            function saveTodayEarnings(amount) {
                var history = loadDailyEarnings();
                var today = getTodayKey();
                history[today] = Math.round(amount * 100) / 100;
                saveDailyEarnings(history);
            }

            // 读取昨日收入
            function getYesterdayEarnings() {
                var history = loadDailyEarnings();
                var yesterday = getYesterdayKey();
                return history[yesterday] || 0;
            }

            // 读取今日已保存的收入（用于跨天后判断）
            function getTodaySavedEarnings() {
                var history = loadDailyEarnings();
                var today = getTodayKey();
                return history[today] || null;
            }

            // ----- 判断是否已过下班时间 -----
            function isAfterWork() {
                var now = new Date();
                var currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
                return currentSeconds >= end.totalSeconds;
            }

            // ----- 判断是否跨天了 -----
            function hasDayChanged() {
                var history = loadDailyEarnings();
                var today = getTodayKey();
                var keys = Object.keys(history);
                if (keys.length === 0) return false;
                // 如果今天的记录已经存在，说明没有跨天（或者已经初始化了）
                // 如果今天的记录不存在，但有昨天的记录，说明跨天了
                if (history[today] !== undefined) return false;
                // 检查是否有昨天的记录
                var yesterday = getYesterdayKey();
                return history[yesterday] !== undefined;
            }

            // ============================================================
            // 6. DOM 引用
            // ============================================================
            var heroCounter = document.getElementById('hero-counter');
            var yesterdayEarningsEl = document.getElementById('yesterday-earnings');
            var todayExpenseEl = document.getElementById('today-expense');
            var netValueEl = document.getElementById('net-value');
            var progressPercentEl = document.getElementById('progress-percent');
            var progressFillEl = document.getElementById('progress-fill');
            var workedTimeTextEl = document.getElementById('worked-time-text');
            var leftTimeTextEl = document.getElementById('left-time-text');
            var hourlyWageDisplay = document.getElementById('hourly-wage-display');
            var hourlyWageItem = document.getElementById('hourly-wage-item');
            var minuteWageEl = document.getElementById('minute-wage');
            var secondWageEl = document.getElementById('second-wage');
            var statusTag = document.getElementById('status-tag');
            var liveIndicator = document.getElementById('live-indicator');
            var liveLabel = document.getElementById('live-label');

            // 显示时薪
            hourlyWageDisplay.textContent = '¥' + baseHourlyWage.toFixed(2);
            hourlyWageItem.textContent = '¥' + baseHourlyWage.toFixed(2);
            minuteWageEl.textContent = '¥' + minuteWageVal.toFixed(2);
            secondWageEl.textContent = '¥' + secondWageVal.toFixed(4);

            // 显示昨日收入
            yesterdayEarningsEl.textContent = '¥' + getYesterdayEarnings().toFixed(2);

            // ============================================================
            // 7. 更新函数（核心）
            // ============================================================
            var lastDayKey = getTodayKey();
            var isTodayDone = false; // 今日是否已完结（下班后定格）
            var todayEarnedCached = null; // 下班后缓存的今日收入

            function update() {
                var now = new Date();
                var todayKey = getTodayKey();
                var currentSeconds = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();

                // ---- 检查是否跨天 ----
                if (todayKey !== lastDayKey) {
                    // 跨天了，重置今日状态
                    lastDayKey = todayKey;
                    isTodayDone = false;
                    todayEarnedCached = null;
                    // 更新昨日收入显示
                    yesterdayEarningsEl.textContent = '¥' + getYesterdayEarnings().toFixed(2);
                    // 检查今日是否已经有保存的记录（比如昨天已经存了今天的？不可能，但以防万一）
                    var savedToday = getTodaySavedEarnings();
                    if (savedToday !== null && savedToday > 0) {
                        // 如果今天已经有保存的收入（理论上不会发生），直接使用
                        isTodayDone = true;
                        todayEarnedCached = savedToday;
                    }
                }

                // ---- 判断当前是否在下班后 ----
                var afterWork = currentSeconds >= end.totalSeconds;

                var workedSeconds = 0;
                var earnedToday = 0;
                var expenseToday = 0;
                var netValue = 0;
                var progress = 0;
                var leftSeconds = 0;

                if (isTodayDone && todayEarnedCached !== null) {
                    // ---- 已下班且已定格：直接使用缓存值 ----
                    earnedToday = todayEarnedCached;
                    expenseToday = dailyExpense;
                    netValue = earnedToday - expenseToday;
                    progress = 100;
                    workedSeconds = totalWorkSeconds;
                    leftSeconds = 0;

                    // 状态标签
                    statusTag.textContent = '🌙 已下班';
                    statusTag.className = 'status-tag off';
                    liveIndicator.className = 'material-symbols-outlined text-[14px] off';
                    liveLabel.textContent = '今日已结';

                } else if (afterWork && !isTodayDone) {
                    // ---- 刚刚下班，第一次进入下班状态：计算全天收入并定格 ----
                    workedSeconds = totalWorkSeconds;
                    earnedToday = workedSeconds * secondWageVal;
                    expenseToday = dailyExpense;
                    netValue = earnedToday - expenseToday;
                    progress = 100;
                    leftSeconds = 0;

                    // 保存今日收入到历史记录
                    saveTodayEarnings(earnedToday);

                    // 缓存并标记完成
                    todayEarnedCached = earnedToday;
                    isTodayDone = true;

                    // 更新昨日收入（因为今天已经结束了，明天会显示今天的数据）
                    // 但是昨日收入显示的是昨天的数据，今天结束后，明天才会显示今天的数据
                    // 所以我们不需要立即更新昨日收入

                    // 状态标签
                    statusTag.textContent = '🌙 已下班';
                    statusTag.className = 'status-tag off';
                    liveIndicator.className = 'material-symbols-outlined text-[14px] off';
                    liveLabel.textContent = '今日已结';

                } else {
                    // ---- 工作时间：实时计算 ----
                    if (currentSeconds <= start.totalSeconds) {
                        workedSeconds = 0;
                    } else if (currentSeconds >= end.totalSeconds) {
                        workedSeconds = totalWorkSeconds;
                    } else {
                        workedSeconds = currentSeconds - start.totalSeconds;
                        var midpoint = start.totalSeconds + (end.totalSeconds - start.totalSeconds) / 2;
                        if (currentSeconds > midpoint) {
                            workedSeconds -= lunchSeconds;
                        }
                    }
                    workedSeconds = Math.max(0, Math.min(workedSeconds, totalWorkSeconds));

                    earnedToday = workedSeconds * secondWageVal;
                    expenseToday = (workedSeconds / totalWorkSeconds) * dailyExpense;
                    if (currentSeconds >= end.totalSeconds) expenseToday = dailyExpense;
                    netValue = earnedToday - expenseToday;
                    progress = totalWorkSeconds > 0 ? (workedSeconds / totalWorkSeconds) * 100 : 0;
                    progress = Math.max(0, Math.min(100, progress));
                    leftSeconds = totalWorkSeconds - workedSeconds;
                    if (currentSeconds >= end.totalSeconds) leftSeconds = 0;

                    // 状态标签
                    if (currentSeconds < start.totalSeconds) {
                        statusTag.textContent = '⏳ 未开始';
                        statusTag.className = 'status-tag weekend';
                        liveIndicator.className = 'material-symbols-outlined text-[14px] off';
                        liveLabel.textContent = '等待开工';
                    } else {
                        statusTag.textContent = '⏳ 工作中';
                        statusTag.className = 'status-tag working';
                        liveIndicator.className = 'material-symbols-outlined text-[14px] animate-realtime';
                        liveLabel.textContent = '实时增长中';
                    }
                }

                // ---- 更新 DOM ----
                heroCounter.textContent = earnedToday.toFixed(2);
                todayExpenseEl.textContent = '-¥' + expenseToday.toFixed(2);
                netValueEl.textContent = '¥' + netValue.toFixed(2);
                progressPercentEl.textContent = progress.toFixed(0) + '%';
                progressFillEl.style.width = progress + '%';
                workedTimeTextEl.innerHTML =
                    '<span class="material-symbols-outlined text-[16px]">schedule</span> 已工作 ' + formatDuration(workedSeconds);
                leftTimeTextEl.textContent = formatDuration(leftSeconds) + ' 距离下班';

                // 微动效
                heroCounter.style.transform = 'scale(1.01)';
                setTimeout(function() { heroCounter.style.transform = 'scale(1)'; }, 100);
            }

            // ============================================================
            // 8. 辅助函数
            // ============================================================
            function formatDuration(seconds) {
                if (seconds < 0) seconds = 0;
                var h = Math.floor(seconds / 3600);
                var m = Math.floor((seconds % 3600) / 60);
                return String(h).padStart(2, '0') + 'h ' + String(m).padStart(2, '0') + 'm';
            }

            // ============================================================
            // 9. 启动更新
            // ============================================================
            update();

            // 每秒更新（但下班后不再更新，只更新时钟）
            setInterval(function() {
                // 如果今日已完结，只更新时间相关的显示（时钟），不重新计算
                if (isTodayDone) {
                    // 只更新时钟，不做其他计算
                    return;
                }
                update();
            }, 1000);

            // 每分钟检查一次是否跨天
            setInterval(function() {
                var today = getTodayKey();
                if (today !== lastDayKey) {
                    // 跨天了，强制更新
                    update();
                    // 更新昨日收入
                    yesterdayEarningsEl.textContent = '¥' + getYesterdayEarnings().toFixed(2);
                }
            }, 60000);

            // 页面可见性变化时刷新
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    // 刷新数据
                    var freshData = localStorage.getItem('timeValueData');
                    if (freshData) {
                        try {
                            var fresh = JSON.parse(freshData);
                            var newSalary = fresh.monthlySalary || 10000;
                            var newWorkDays = fresh.workDays || 22;
                            var newWorkHours = fresh.workHoursPerDay || 8;
                            if (newSalary !== salary || newWorkDays !== workDays || newWorkHours !== workHoursPerDay) {
                                salary = newSalary;
                                workDays = newWorkDays;
                                workHoursPerDay = newWorkHours;
                                baseHourlyWage = salary / (workDays * workHoursPerDay);
                                minuteWageVal = baseHourlyWage / 60;
                                secondWageVal = baseHourlyWage / 3600;
                                hourlyWageDisplay.textContent = '¥' + baseHourlyWage.toFixed(2);
                                hourlyWageItem.textContent = '¥' + baseHourlyWage.toFixed(2);
                                minuteWageEl.textContent = '¥' + minuteWageVal.toFixed(2);
                                secondWageEl.textContent = '¥' + secondWageVal.toFixed(4);
                            }
                        } catch (e) {}
                    }
                    // 检查是否跨天
                    var todayKey = getTodayKey();
                    if (todayKey !== lastDayKey) {
                        lastDayKey = todayKey;
                        isTodayDone = false;
                        todayEarnedCached = null;
                        yesterdayEarningsEl.textContent = '¥' + getYesterdayEarnings().toFixed(2);
                        // 检查今天是否已经有保存的收入
                        var savedToday = getTodaySavedEarnings();
                        if (savedToday !== null && savedToday > 0) {
                            isTodayDone = true;
                            todayEarnedCached = savedToday;
                        }
                        update();
                    }
                }
            });

        });
    </script>

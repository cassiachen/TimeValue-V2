    <style>
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 24px);
        }
        .pt-safe {
            padding-top: env(safe-area-inset-top, 24px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .delete-item-btn:hover .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;

        .purchased-badge {
            background: #e8f5e9;

        }

        /* 明细弹窗 */
        .bonus-detail-popup {
            position: absolute;
            top: calc(100% + 8px);
            right: 0;
            background: #ffffff;
            border-radius: 16px;
            padding: 16px 20px;
            min-width: 200px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            opacity: 0;
            transform: translateY(-8px) scale(0.95);
            pointer-events: none;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
        }
        .bonus-detail-popup.show {
            opacity: 1;
            transform: translateY(0) scale(1);
            pointer-events: auto;
        }
        .bonus-detail-popup::before {
            content: '';
            position: absolute;
            top: -6px;
            right: 20px;
            width: 12px;
            height: 12px;
            background: #ffffff;
            transform: rotate(45deg);
            border-radius: 2px;
        }
    </style>

<body class="bg-background text-on-background font-body-lg text-body-lg min-h-screen antialiased flex flex-col">
    <!-- TopAppBar -->
    <header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-page h-14 bg-surface text-primary pt-safe">
        <button class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full hover:bg-surface-container transition-colors active:scale-95 duration-200" onclick="window.location.href='settings.html'">
            <span class="material-symbols-outlined text-primary text-[24px]">menu</span>
        </button>
        <h1 class="font-headline-md text-headline-md-mobile md:text-headline-md font-bold tracking-tight text-primary absolute left-1/2 -translate-x-1/2">
            时值 TimeValue
        </h1>
        <div class="w-10"></div>
    </header>

    <main class="flex-1 px-margin-page pt-28 pb-32 flex flex-col gap-stack-lg max-w-md mx-auto w-full">
        <!-- 时薪显示（含学习加薪右上角标签） -->
        <section class="relative flex flex-col gap-stack-sm animate-fade-in-up">
            <h2 class="font-body-md text-body-md text-on-surface-variant uppercase tracking-wider">你的时间价值</h2>
            <div class="flex items-baseline gap-2">
                <span class="font-display-lg text-display-lg text-primary" id="hourly-wage-display">¥0.00</span>
                <span class="font-body-md text-body-md text-on-surface-variant">/ 小时</span>
            </div>
            <div class="h-[1px] w-12 bg-primary/10 mt-2"></div>

            <!-- 学习加薪标签（右上角小字） -->
            <div class="absolute top-0 right-0" id="bonus-tag-wrapper" style="display:none;">
                <button class="flex items-center gap-1 text-xs text-tertiary-fixed-dim hover:text-tertiary-fixed-dim/70 transition-colors font-medium px-2 py-1 rounded-full bg-tertiary-fixed/10" id="bonus-tag-btn">
                    <span class="material-symbols-outlined text-[14px]">school</span>
                    <span id="bonus-tag-text">+¥0.00 学习加薪</span>
                    <span class="material-symbols-outlined text-[12px]">expand_more</span>
                </button>
                <!-- 明细弹窗 -->
                <div class="bonus-detail-popup" id="bonus-detail-popup">
                    <div class="font-label-sm text-label-sm text-on-surface-variant mb-2">🎓 学习加薪明细</div>
                    <div id="bonus-detail-list" class="flex flex-col gap-1.5 text-sm">
                        <div class="text-on-surface-variant/60 text-xs">暂无已完成的目标</div>
                    </div>
                    <div class="mt-3 pt-2 border-t border-surface-variant/30 flex justify-between text-xs">
                        <span class="text-on-surface-variant">累计加薪</span>
                        <span class="font-bold text-tertiary-fixed-dim" id="bonus-detail-total">+¥0.00</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 人生价格表 -->
        <section class="flex flex-col gap-stack-md animate-fade-in-up" style="animation-delay:0.1s;">
            <div class="flex items-center justify-between mb-2">
                <h3 class="font-headline-md-mobile text-headline-md-mobile text-primary">人生价格表</h3>
                <span class="font-label-sm text-label-sm text-on-surface-variant">用时间衡量一切</span>
            </div>
            <div class="flex flex-col gap-stack-md w-full" id="items-container">
                <!-- 由 JavaScript 动态渲染 -->
            </div>

            <button class="w-full flex items-center justify-center p-6 border border-dashed border-outline-variant rounded-xl bg-transparent hover:bg-surface-container-low text-on-surface-variant transition-colors active:scale-[0.98] duration-200 mt-2 gap-2" id="btn-add-item">
                <span class="material-symbols-outlined">add</span>
                <span class="font-body-md text-body-md">添加新目标</span>
            </button>
        </section>
    </main>

    <!-- BottomNavBar -->
   <!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-page py-4 pb-safe bg-surface/95 backdrop-blur-md shadow-[0_-10px_30px_rgba(0,0,0,0.04)] rounded-t-xl">

    <!-- 今日工资 -->
    <button class="flex flex-col items-center justify-center text-outline hover:text-primary transition-colors duration-300 w-16 gap-1" onclick="window.location.href='wage.html'">
        <span class="material-symbols-outlined" style="font-variation-settings:'FILL'0;">payments</span>
        <span class="font-label-sm text-[11px]">今日工资</span>
    </button>

    <!-- 学习涨薪 -->
    <button class="flex flex-col items-center justify-center text-outline hover:text-primary transition-colors duration-300 w-16 gap-1" onclick="window.location.href='learn.html'">
        <span class="material-symbols-outlined" style="font-variation-settings:'FILL'0;">school</span>
        <span class="font-label-sm text-[11px]">学习涨薪</span>
    </button>

    <!-- 时间消费 -->
    <button class="flex flex-col items-center justify-center text-outline hover:text-primary transition-colors duration-300 w-16 gap-1" onclick="window.location.href='time.html'">
        <span class="material-symbols-outlined" style="font-variation-settings:'FILL'0;">schedule</span>
        <span class="font-label-sm text-[11px]">时间消费</span>
    </button>

    <!-- 人生剩余 -->
    <button class="flex flex-col items-center justify-center text-outline hover:text-primary transition-colors duration-300 w-16 gap-1" onclick="window.location.href='life.html'">
        <span class="material-symbols-outlined" style="font-variation-settings:'FILL'0;">auto_awesome</span>
        <span class="font-label-sm text-[11px]">人生剩余</span>
    </button>

</nav>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // ============================================================
            // 1. 读取用户薪资数据（实际工资）
            // ============================================================
            var userData = null;
            var saved = localStorage.getItem('timeValueData');
            if (saved) {
                try {
                    userData = JSON.parse(saved);
                } catch (e) {
                    console.warn('薪资数据解析失败');
                }
            }

            var salary = userData && userData.monthlySalary ? userData.monthlySalary : 10000;
            var workDays = userData && userData.workDays ? userData.workDays : 22;
            var workHoursPerDay = userData && userData.workHoursPerDay ? userData.workHoursPerDay : 8;

            var hourlyWage = salary / (workDays * workHoursPerDay);
            document.getElementById('hourly-wage-display').textContent = '¥' + hourlyWage.toFixed(2);

            // ============================================================
            // 2. 学习加薪（假想，只展示）
            // ============================================================
            var learningBonus = 0;
            var completedGoals = [];
            var bonusStored = localStorage.getItem('learningTotalBonus');
            if (bonusStored) {
                try {
                    learningBonus = parseFloat(bonusStored) || 0;
                } catch (e) {}
            }
            var goalsStored = localStorage.getItem('learningGoals');
            if (goalsStored) {
                try {
                    var allGoals = JSON.parse(goalsStored);
                    completedGoals = allGoals.filter(function(g) { return g.isCompleted === true; });
                } catch (e) {}
            }

            var bonusWrapper = document.getElementById('bonus-tag-wrapper');
            var bonusTagText = document.getElementById('bonus-tag-text');
            var bonusDetailList = document.getElementById('bonus-detail-list');
            var bonusDetailTotal = document.getElementById('bonus-detail-total');
            var popup = document.getElementById('bonus-detail-popup');
            var tagBtn = document.getElementById('bonus-tag-btn');

            if (learningBonus > 0 && completedGoals.length > 0) {
                bonusWrapper.style.display = 'block';
                bonusTagText.textContent = '+¥' + learningBonus.toFixed(2) + ' 学习加薪';

                var detailHtml = '';
                completedGoals.forEach(function(g) {
                    detailHtml += '<div class="flex justify-between items-center py-1 border-b border-surface-variant/20 last:border-0">' +
                        '<span class="text-on-surface">' + g.skillName + '</span>' +
                        '<span class="text-tertiary-fixed-dim font-medium">+¥' + g.bonus.toFixed(2) + '/h</span>' +
                        '</div>';
                });
                bonusDetailList.innerHTML = detailHtml;
                bonusDetailTotal.textContent = '+¥' + learningBonus.toFixed(2);

                tagBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    popup.classList.toggle('show');
                });
                document.addEventListener('click', function() {
                    popup.classList.remove('show');
                });
                popup.addEventListener('click', function(e) {
                    e.stopPropagation();
                });
            } else {
                bonusWrapper.style.display = 'none';
            }

            // ============================================================
            // 3. 物品数据管理
            // ============================================================

            var defaultItems = [
                { icon: 'smartphone', name: 'iPhone 15 Pro', price: 8999 },
                { icon: 'coffee', name: '奶茶', price: 30 },
                { icon: 'local_movies', name: '电影票', price: 80 },
                { icon: 'restaurant', name: '火锅大餐', price: 300 },
                { icon: 'directions_run', name: '运动鞋', price: 800 },
                { icon: 'headphones', name: 'AirPods Pro', price: 1899 }
            ];

            function loadItems() {
                var stored = localStorage.getItem('timeItems');
                if (stored) {
                    try {
                        var parsed = JSON.parse(stored);
                        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                    } catch (e) {}
                }
                saveItems(defaultItems);
                return defaultItems.slice();
            }

            function saveItems(items) {
                localStorage.setItem('timeItems', JSON.stringify(items));
            }

            var items = loadItems();

            // ============================================================
            // 4. 消费记录
            // ============================================================

            var purchaseKey = 'purchaseHistory';

            function loadPurchases() {
                var stored = localStorage.getItem(purchaseKey);
                if (stored) {
                    try { return JSON.parse(stored); } catch (e) {}
                }
                return [];
            }

            function savePurchases(purchases) {
                localStorage.setItem(purchaseKey, JSON.stringify(purchases));
            }

            var purchases = loadPurchases();

            function updateSpendingStats() {
                var total = purchases.reduce(function(sum, p) { return sum + p.price; }, 0);
                // 如果有顶部统计，这里可以更新，但 time.html 没有，留空
            }
            updateSpendingStats();

            // ============================================================
            // 5. 渲染
            // ============================================================

            function renderItems() {
                var container = document.getElementById('items-container');
                if (!container) return;

                if (items.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-8 text-on-surface-variant opacity-60">
                            <span class="material-symbols-outlined text-[48px] block mx-auto mb-3">shopping_bag</span>
                            <p class="font-body-md text-body-md">还没有物品，点击下方添加吧</p>
                        </div>
                    `;
                    return;
                }

                var html = '';
                items.forEach(function(item, index) {
                    var hours = item.price / hourlyWage;
                    var days = hours / workHoursPerDay;
                    var isPurchased = purchases.some(function(p) {
                        return p.itemName === item.name && p.price === item.price;
                    });

                    html += `
                        <div class="price-card bg-surface-container-lowest rounded-xl p-6 shadow-[0_10px_30px_rgba(0,0,0,0.04)] flex flex-col gap-stack-md transition-transform active:scale-[0.98] duration-300 animate-fade-in-up" data-index="${index}">
                            <div class="flex justify-between items-start">
                                <h4 class="font-body-lg text-body-lg text-primary font-medium">
                                    <span class="material-symbols-outlined text-[22px] align-middle">${item.icon || 'shopping_bag'}</span>
                                    ${item.name}
                                    ${isPurchased ? '<span class="purchased-badge ml-2">已拥有</span>' : ''}
                                </h4>
                                <div class="flex items-center gap-2">
                                    <span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container px-2 py-1 rounded item-price">¥${item.price.toLocaleString()}</span>
                                    <button class="delete-item-btn text-on-surface-variant hover:text-error transition-colors p-1 -mr-1" data-index="${index}" aria-label="删除">
                                        <span class="material-symbols-outlined text-[20px]">close</span>
                                    </button>
                                </div>
                            </div>
                            <div class="bg-surface-bright rounded-lg p-4 flex flex-col gap-2 border border-surface-variant/50">
                                <div class="flex items-baseline gap-2">
                                    <span class="font-body-md text-body-md text-on-surface-variant">需要工作</span>
                                    <span class="font-headline-md-mobile text-headline-md-mobile text-primary tracking-tight req-hours">${Math.ceil(hours)}</span>
                                    <span class="font-body-md text-body-md text-on-surface-variant">小时</span>
                                </div>
                                <p class="font-label-sm text-label-sm text-on-surface-variant opacity-80 flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[14px]">calendar_today</span>
                                    约 <span class="req-days">${Math.ceil(days)}</span> 个工作日
                                </p>
                                <div class="mt-2">
                                    ${isPurchased ? `
                                        <button class="w-full text-sm py-1.5 rounded-full bg-error/10 text-error hover:bg-error/20 transition-colors flex items-center justify-center gap-1 undo-purchase-btn" data-index="${index}">
                                            <span class="material-symbols-outlined text-[16px]">undo</span> 后悔了（撤销）
                                        </button>
                                    ` : `
                                        <button class="w-full text-sm py-1.5 rounded-full bg-primary/10 text-primary hover:bg-primary/20 transition-colors flex items-center justify-center gap-1 purchase-btn" data-index="${index}">
                                            <span class="material-symbols-outlined text-[16px]">shopping_cart</span> 冲动购买
                                        </button>
                                    `}
                                </div>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            }

            // ============================================================
            // 6. 操作函数
            // ============================================================

            function addItem(name, price, icon) {
                items.push({ icon: icon || 'shopping_bag', name: name.trim(), price: price });
                saveItems(items);
                renderItems();
            }

            function deleteItem(index) {
                if (index < 0 || index >= items.length) return;
                var item = items[index];
                purchases = purchases.filter(function(p) {
                    return !(p.itemName === item.name && p.price === item.price);
                });
                savePurchases(purchases);
                items.splice(index, 1);
                saveItems(items);
                renderItems();
            }

            function purchaseItem(index) {
                if (index < 0 || index >= items.length) return;
                var item = items[index];
                var hours = item.price / hourlyWage;
                var msg = '你确定要用 ' + Math.ceil(hours) + ' 小时的生命换取它吗？\n\n这些时间，本可以用来陪伴家人、学习成长、好好休息……\n\n三思而后行！';
                if (!confirm(msg)) return;
                var already = purchases.some(function(p) {
                    return p.itemName === item.name && p.price === item.price;
                });
                if (already) {
                    alert('你已经拥有它了！');
                    return;
                }
                purchases.push({ itemName: item.name, price: item.price, timestamp: Date.now() });
                savePurchases(purchases);
                renderItems();
                alert('✅ 已记录购买：' + item.name + '（花费 ' + Math.ceil(hours) + ' 小时生命）');
            }

            function undoPurchase(index) {
                if (index < 0 || index >= items.length) return;
                var item = items[index];
                var idx = purchases.findIndex(function(p) {
                    return p.itemName === item.name && p.price === item.price;
                });
                if (idx === -1) {
                    alert('未找到购买记录');
                    return;
                }
                if (!confirm('确定要撤销 ' + item.name + ' 的购买吗？')) return;
                purchases.splice(idx, 1);
                savePurchases(purchases);
                renderItems();
            }

            // ============================================================
            // 7. 事件绑定
            // ============================================================

            var container = document.getElementById('items-container');

            container.addEventListener('click', function(e) {
                var deleteBtn = e.target.closest('.delete-item-btn');
                if (deleteBtn) {
                    var index = parseInt(deleteBtn.dataset.index, 10);
                    if (!isNaN(index)) deleteItem(index);
                }
            });

            container.addEventListener('click', function(e) {
                var purchaseBtn = e.target.closest('.purchase-btn');
                if (purchaseBtn) {
                    var index = parseInt(purchaseBtn.dataset.index, 10);
                    if (!isNaN(index)) purchaseItem(index);
                }
            });

            container.addEventListener('click', function(e) {
                var undoBtn = e.target.closest('.undo-purchase-btn');
                if (undoBtn) {
                    var index = parseInt(undoBtn.dataset.index, 10);
                    if (!isNaN(index)) undoPurchase(index);
                }
            });

            document.getElementById('btn-add-item').addEventListener('click', function() {
                var name = prompt('请输入物品名称（如：MacBook Pro）:');
                if (!name || name.trim() === '') return;
                var priceStr = prompt('请输入物品价格（如：12999）:');
                if (!priceStr) return;
                var price = parseFloat(priceStr.replace(/[^\d.]/g, ''));
                if (isNaN(price) || price <= 0) {
                    alert('请输入有效的价格');
                    return;
                }
                addItem(name.trim(), price, 'shopping_bag');
            });

            // ============================================================
            // 8. 首次渲染 & 跨页面同步
            // ============================================================

            renderItems();

            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    var fresh = localStorage.getItem('timeValueData');
                    if (fresh) {
                        try {
                            var freshData = JSON.parse(fresh);
                            var newSalary = freshData.monthlySalary || 10000;
                            var newWorkDays = freshData.workDays || 22;
                            var newWorkHours = freshData.workHoursPerDay || 8;
                            if (newSalary !== salary || newWorkDays !== workDays || newWorkHours !== workHoursPerDay) {
                                salary = newSalary;
                                workDays = newWorkDays;
                                workHoursPerDay = newWorkHours;
                                hourlyWage = salary / (workDays * workHoursPerDay);
                                document.getElementById('hourly-wage-display').textContent = '¥' + hourlyWage.toFixed(2);
                                renderItems();
                            }
                        } catch (e) {}
                    }
                    // 刷新学习加薪
                    var freshBonus = localStorage.getItem('learningTotalBonus');
                    if (freshBonus) {
                        try {
                            var newBonus = parseFloat(freshBonus) || 0;
                            if (newBonus !== learningBonus) {
                                learningBonus = newBonus;
                                // 刷新标签显示
                                // 简化：直接重新加载页面
                                location.reload();
                            }
                        } catch (e) {}
                    }
                }
            });

        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <title>时值 TimeValue - 时间价值</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries">
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "secondary-container": "#e0dfe4",
                        "surface-bright": "#f9f9fb",
                        "tertiary-fixed-dim": "#4edea3",
                        "on-tertiary": "#ffffff",
                        "outline": "#77767b",
                        "inverse-surface": "#2f3132",
                        "secondary-fixed": "#e3e2e7",
                        "tertiary-fixed": "#6ffbbe",
                        "on-surface-variant": "#46464a",
                        "on-tertiary-fixed-variant": "#005236",
                        "secondary": "#5e5e63",
                        "outline-variant": "#c7c6ca",
                        "on-secondary-container": "#626267",
                        "on-secondary-fixed": "#1a1b1f",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#c8c6c8",
                        "error-container": "#ffdad6",
                        "surface-variant": "#e2e2e4",
                        "surface-container": "#eeeef0",
                        "error": "#ba1a1a",
                        "primary": "#030304",
                        "on-primary-fixed": "#1b1b1d",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#c8c6c8",
                        "tertiary-container": "#002315",
                        "surface-tint": "#5f5e60",
                        "on-tertiary-container": "#009869",
                        "background": "#f9f9fb",
                        "secondary-fixed-dim": "#c7c6cb",
                        "primary-fixed": "#e4e2e4",
                        "on-primary-fixed-variant": "#474649",
                        "on-primary": "#ffffff",
                        "on-background": "#1a1c1d",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#002113",
                        "surface-container-high": "#e8e8ea",
                        "surface-container-highest": "#e2e2e4",
                        "inverse-on-surface": "#f0f0f2",
                        "surface": "#f9f9fb",
                        "on-secondary": "#ffffff",
                        "on-surface": "#1a1c1d",
                        "on-secondary-fixed-variant": "#46464b",
                        "tertiary": "#000502",
                        "primary-container": "#1d1d1f",
                        "on-primary-container": "#868587",
                        "surface-container-low": "#f3f3f5",
                        "surface-dim": "#d9dadc"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "stack-md": "16px",
                        "unit": "4px",
                        "stack-sm": "8px",
                        "margin-page": "24px",
                        "stack-lg": "32px",
                        "gutter-card": "16px"
                    },
                    fontFamily: {
                        "body-lg": ["Inter"],
                        "headline-lg": ["Inter"],
                        "headline-md": ["Inter"],
                        "label-sm": ["Inter"],
                        "display-lg": ["Inter"],
                        "body-md": ["Inter"],
                        "headline-lg-mobile": ["Inter"]
                    },
                    fontSize: {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "30px", "fontWeight": "600" }],
                        "label-sm": ["13px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "500" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "34px", "letterSpacing": "-0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
    <style>
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 24px);
        }
        .pt-safe {
            padding-top: env(safe-area-inset-top, 24px);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .delete-item-btn:hover .material-symbols-outlined {
            font-variation-settings: 'FILL' 1;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-lg text-body-lg min-h-screen antialiased flex flex-col">
    <!-- TopAppBar -->
    <header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-page h-14 bg-surface text-primary pt-safe">
        <button class="flex items-center justify-center w-10 h-10 -ml-2 rounded-full hover:bg-surface-container transition-colors active:scale-95 duration-200" onclick="window.location.href='settings.html'">
            <span class="material-symbols-outlined text-primary text-[24px]">menu</span>
        </button>
        <h1 class="font-headline-md text-headline-md-mobile md:text-headline-md font-bold tracking-tight text-primary absolute left-1/2 -translate-x-1/2">
            时值 TimeValue
        </h1>
        <div class="w-10"></div>
    </header>

    <main class="flex-1 px-margin-page pt-28 pb-32 flex flex-col gap-stack-lg max-w-md mx-auto w-full">
        <!-- 时薪显示 -->
        <section class="flex flex-col gap-stack-sm animate-fade-in-up">
            <h2 class="font-body-md text-body-md text-on-surface-variant uppercase tracking-wider">你的时间价值</h2>
            <div class="flex items-baseline gap-2">
                <span class="font-display-lg text-display-lg text-primary" id="hourly-wage-display">¥0.00</span>
                <span class="font-body-md text-body-md text-on-surface-variant">/ 小时</span>
            </div>
            <div class="h-[1px] w-12 bg-primary/10 mt-2"></div>
        </section>

        <!-- 人生价格表 -->
        <section class="flex flex-col gap-stack-md animate-fade-in-up" style="animation-delay:0.1s;">
            <div class="flex items-center justify-between mb-2">
                <h3 class="font-headline-md-mobile text-headline-md-mobile text-primary">人生价格表</h3>
                <span class="font-label-sm text-label-sm text-on-surface-variant">用时间衡量一切</span>
            </div>
            <div class="flex flex-col gap-stack-md w-full" id="items-container">
                <!-- 由 JavaScript 动态渲染 -->
            </div>

            <!-- 添加按钮 -->
            <button class="w-full flex items-center justify-center p-6 border border-dashed border-outline-variant rounded-xl bg-transparent hover:bg-surface-container-low text-on-surface-variant transition-colors active:scale-[0.98] duration-200 mt-2 gap-2" id="btn-add-item">
                <span class="material-symbols-outlined">add</span>
                <span class="font-body-md text-body-md">添加新目标</span>
            </button>
        </section>
    </main>

    <!-- BottomNavBar -->
    <nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-margin-page py-4 pb-safe bg-surface/95 backdrop-blur-md shadow-[0_-10px_30px_rgba(0,0,0,0.04)] rounded-t-xl">
        <button class="flex flex-col items-center justify-center text-outline transition-transform duration-300 ease-out hover:text-primary active:scale-95" onclick="window.location.href='wage.html'">
            <span class="material-symbols-outlined text-[24px] mb-1">payments</span>
            <span class="font-label-sm text-label-sm">工资</span>
        </button>
        <button class="flex flex-col items-center justify-center text-primary font-bold transition-transform duration-300 ease-out scale-[1.02]" onclick="window.location.href='time.html'">
            <span class="material-symbols-outlined text-[24px] mb-1" style="font-variation-settings:'FILL'1;">schedule</span>
            <span class="font-label-sm text-label-sm">时间</span>
        </button>
        <button class="flex flex-col items-center justify-center text-outline transition-transform duration-300 ease-out hover:text-primary active:scale-95" onclick="window.location.href='life.html'">
            <span class="material-symbols-outlined text-[24px] mb-1">auto_awesome</span>
            <span class="font-label-sm text-label-sm">人生</span>
        </button>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // ============================================================
            // 1. 读取用户薪资数据
            // ============================================================
            var userData = null;
            var saved = localStorage.getItem('timeValueData');
            if (saved) {
                try {
                    userData = JSON.parse(saved);
                } catch (e) {
                    console.warn('薪资数据解析失败');
                }
            }

            var salary = userData && userData.monthlySalary ? userData.monthlySalary : 10000;
            var workDays = userData && userData.workDays ? userData.workDays : 22;
            var workHoursPerDay = userData && userData.workHoursPerDay ? userData.workHoursPerDay : 8;

            var hourlyWage = salary / (workDays * workHoursPerDay);
            document.getElementById('hourly-wage-display').textContent = '¥' + hourlyWage.toFixed(2);

            // ============================================================
            // 2. 物品数据管理（localStorage 持久化）
            // ============================================================

            // 默认物品列表（包含 icon 和 name 和 price）
            var defaultItems = [
                { icon: 'smartphone', name: 'iPhone 15 Pro', price: 8999 },
                { icon: 'coffee', name: '奶茶', price: 30 },
                { icon: 'local_movies', name: '电影票', price: 80 },
                { icon: 'restaurant', name: '火锅大餐', price: 300 },
                { icon: 'directions_run', name: '运动鞋', price: 800 },
                { icon: 'headphones', name: 'AirPods Pro', price: 1899 }
            ];

            // 从 localStorage 读取物品列表，若无则使用默认列表并存入
            function loadItems() {
                var stored = localStorage.getItem('timeItems');
                if (stored) {
                    try {
                        var parsed = JSON.parse(stored);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            return parsed;
                        }
                    } catch (e) {
                        console.warn('物品数据解析失败，使用默认列表');
                    }
                }
                // 无数据或解析失败 → 保存默认并返回
                saveItems(defaultItems);
                return defaultItems.slice(); // 返回副本
            }

            function saveItems(items) {
                localStorage.setItem('timeItems', JSON.stringify(items));
            }

            // 当前物品列表
            var items = loadItems();

            // ============================================================
            // 3. 渲染函数
            // ============================================================

            function renderItems() {
                var container = document.getElementById('items-container');
                if (!container) return;

                if (items.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-8 text-on-surface-variant opacity-60">
                            <span class="material-symbols-outlined text-[48px] block mx-auto mb-3">shopping_bag</span>
                            <p class="font-body-md text-body-md">还没有物品，点击下方添加吧</p>
                        </div>
                    `;
                    return;
                }

                var html = '';
                items.forEach(function(item, index) {
                    var hours = item.price / hourlyWage;
                    var days = hours / workHoursPerDay;

                    html += `
                        <div class="price-card bg-surface-container-lowest rounded-xl p-6 shadow-[0_10px_30px_rgba(0,0,0,0.04)] flex flex-col gap-stack-md transition-transform active:scale-[0.98] duration-300 animate-fade-in-up" data-index="${index}">
                            <div class="flex justify-between items-start">
                                <h4 class="font-body-lg text-body-lg text-primary font-medium">
                                    <span class="material-symbols-outlined text-[22px] align-middle">${item.icon || 'shopping_bag'}</span>
                                    ${item.name}
                                </h4>
                                <div class="flex items-center gap-2">
                                    <span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container px-2 py-1 rounded item-price">¥${item.price.toLocaleString()}</span>
                                    <button class="delete-item-btn text-on-surface-variant hover:text-error transition-colors p-1 -mr-1" data-index="${index}" aria-label="删除">
                                        <span class="material-symbols-outlined text-[20px]">close</span>
                                    </button>
                                </div>
                            </div>
                            <div class="bg-surface-bright rounded-lg p-4 flex flex-col gap-1 border border-surface-variant/50">
                                <div class="flex items-baseline gap-2">
                                    <span class="font-body-md text-body-md text-on-surface-variant">需要工作</span>
                                    <span class="font-headline-md-mobile text-headline-md-mobile text-primary tracking-tight req-hours">${Math.ceil(hours)}</span>
                                    <span class="font-body-md text-body-md text-on-surface-variant">小时</span>
                                </div>
                                <p class="font-label-sm text-label-sm text-on-surface-variant opacity-80 flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[14px]">calendar_today</span>
                                    约 <span class="req-days">${Math.ceil(days)}</span> 个工作日
                                </p>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;
            }

            // ============================================================
            // 4. 操作函数：添加 & 删除
            // ============================================================

            function addItem(name, price, icon) {
                var newItem = {
                    icon: icon || 'shopping_bag',
                    name: name.trim(),
                    price: price
                };
                items.push(newItem);
                saveItems(items);
                renderItems();
            }

            function deleteItem(index) {
                if (index < 0 || index >= items.length) return;
                items.splice(index, 1);
                saveItems(items);
                renderItems();
            }

            // ============================================================
            // 5. 事件绑定（使用事件委托）
            // ============================================================

            // 删除按钮点击（委托到容器）
            document.getElementById('items-container').addEventListener('click', function(e) {
                var deleteBtn = e.target.closest('.delete-item-btn');
                if (deleteBtn) {
                    var index = parseInt(deleteBtn.dataset.index, 10);
                    if (!isNaN(index)) {
                        deleteItem(index);
                    }
                }
            });

            // 添加按钮
            document.getElementById('btn-add-item').addEventListener('click', function() {
                var name = prompt('请输入物品名称（如：MacBook Pro）:');
                if (!name || name.trim() === '') return;

                var priceStr = prompt('请输入物品价格（如：12999）:');
                if (!priceStr) return;

                var price = parseFloat(priceStr.replace(/[^\d.]/g, ''));
                if (isNaN(price) || price <= 0) {
                    alert('请输入有效的价格');
                    return;
                }

                // 可选的图标选择（简单处理，默认用 shopping_bag）
                var icon = 'shopping_bag';
                addItem(name.trim(), price, icon);
            });

            // ============================================================
            // 6. 首次渲染
            // ============================================================

            renderItems();

            // 当薪资变化时重新渲染（例如用户在设置页修改后返回）
            // 可以监听 storage 变化（跨页面同步），简单起见，页面可见时刷新
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    // 重新读取薪资
                    var fresh = localStorage.getItem('timeValueData');
                    if (fresh) {
                        try {
                            var freshData = JSON.parse(fresh);
                            var newSalary = freshData.monthlySalary || 10000;
                            var newWorkDays = freshData.workDays || 22;
                            var newWorkHours = freshData.workHoursPerDay || 8;
                            if (newSalary !== salary || newWorkDays !== workDays || newWorkHours !== workHoursPerDay) {
                                salary = newSalary;
                                workDays = newWorkDays;
                                workHoursPerDay = newWorkHours;
                                hourlyWage = salary / (workDays * workHoursPerDay);
                                document.getElementById('hourly-wage-display').textContent = '¥' + hourlyWage.toFixed(2);
                                renderItems();
                            }
                        } catch (e) {}
                    }
                }
            });

        });
    </script>
</body>
</html>

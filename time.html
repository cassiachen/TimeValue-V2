    <!-- ============================================================
    JavaScript

    <script>
        document.addEventListener('DOMContentLoaded', function() {

            // ============================================================
            // 1. 读取数据
            // ============================================================
            var userData = null;
            var saved = localStorage.getItem('timeValueData');
            if (saved) {
                try { userData = JSON.parse(saved); } catch (e) {}
            }

            var salary = userData && userData.monthlySalary ? userData.monthlySalary : 10000;
            var workDays = userData && userData.workDays ? userData.workDays : 22;
            var workHoursPerDay = userData && userData.workHoursPerDay ? userData.workHoursPerDay : 8;
            var hourlyWage = salary / (workDays * workHoursPerDay);

            document.getElementById('hourly-wage-display').textContent = '¥' + hourlyWage.toFixed(2);

            // ============================================================
            // 2. 分类定义
            // ============================================================
            var CATEGORIES = [
                { key: '餐饮', icon: '🍜' },
                { key: '交通', icon: '🚇' },
                { key: '居住', icon: '🏠' },
                { key: '购物', icon: '🛒' },
                { key: '娱乐', icon: '🎬' },
                { key: '学习', icon: '📚' },
                { key: '其他', icon: '📌' }
            ];

            var categoryMap = {};
            CATEGORIES.forEach(function(c) { categoryMap[c.key] = c; });

            // ============================================================
            // 3. 交易数据管理
            // ============================================================
            var TRANSACTIONS_KEY = 'transactions';

            function loadTransactions() {
                var stored = localStorage.getItem(TRANSACTIONS_KEY);
                if (stored) {
                    try { return JSON.parse(stored); } catch (e) {}
                }
                var oldData = localStorage.getItem('purchaseHistory');
                if (oldData) {
                    try {
                        var old = JSON.parse(oldData);
                        if (Array.isArray(old) && old.length > 0) {
                            var migrated = old.map(function(p) {
                                return {
                                    id: p.timestamp || Date.now() + Math.random() * 1000,
                                    name: p.itemName || '未知物品',
                                    amount: p.price || 0,
                                    category: '购物',
                                    timestamp: p.timestamp || Date.now(),
                                    note: '来自价格表'
                                };
                            });
                            saveTransactions(migrated);
                            return migrated;
                        }
                    } catch (e) {}
                }
                return [];
            }

            function saveTransactions(txns) {
                localStorage.setItem(TRANSACTIONS_KEY, JSON.stringify(txns));
            }

            var transactions = loadTransactions();

            // ============================================================
            // 4. 物品数据管理（价格表）
            // ============================================================
            var defaultItems = [
                { icon: 'smartphone', name: 'iPhone 15 Pro', price: 8999 },
                { icon: 'coffee', name: '奶茶', price: 30 },
                { icon: 'local_movies', name: '电影票', price: 80 },
                { icon: 'restaurant', name: '火锅大餐', price: 300 },
                { icon: 'directions_run', name: '运动鞋', price: 800 },
                { icon: 'headphones', name: 'AirPods Pro', price: 1899 }
            ];

            function loadItems() {
                var stored = localStorage.getItem('timeItems');
                if (stored) {
                    try {
                        var parsed = JSON.parse(stored);
                        if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                    } catch (e) {}
                }
                saveItems(defaultItems);
                return defaultItems.slice();
            }

            function saveItems(items) {
                localStorage.setItem('timeItems', JSON.stringify(items));
            }

            var items = loadItems();

            // ============================================================
            // 5. 工具函数
            // ============================================================
            function getTodayKey() {
                var d = new Date();
                return d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
            }

            function formatDate(ts) {
                var d = new Date(ts);
                var weekdays = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
                return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + weekdays[d.getDay()];
            }

            function getMonthKey(ts) {
                var d = new Date(ts);
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
            }

            function getCurrentMonthKey() {
                var d = new Date();
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
            }

            function getLastMonthKey() {
                var d = new Date();
                d.setMonth(d.getMonth() - 1);
                return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
            }

            function getCategoryIcon(key) {
                var c = categoryMap[key];
                return c ? c.icon : '📌';
            }

            function getCategoryLabel(key) {
                var c = categoryMap[key];
                return c ? c.key : '其他';
            }

            // ============================================================
            // 6. 渲染
            // ============================================================
            var currentFilter = 'all';

            function renderLifeHours() {
                var currentMonth = getCurrentMonthKey();
                var totalAmount = 0;
                transactions.forEach(function(t) {
                    if (getMonthKey(t.timestamp) === currentMonth) {
                        totalAmount += t.amount;
                    }
                });
                var hours = totalAmount / hourlyWage;
                document.getElementById('life-hours-display').textContent = hours.toFixed(1);
            }

            function renderStats() {
                var currentMonth = getCurrentMonthKey();
                var lastMonth = getLastMonthKey();

                var currentTotal = 0;
                var currentCount = 0;
                var lastTotal = 0;

                transactions.forEach(function(t) {
                    var mk = getMonthKey(t.timestamp);
                    if (mk === currentMonth) {
                        currentTotal += t.amount;
                        currentCount++;
                    } else if (mk === lastMonth) {
                        lastTotal += t.amount;
                    }
                });

                document.getElementById('stat-monthly').textContent = '¥' + Math.round(currentTotal).toLocaleString();
                document.getElementById('stat-count').textContent = currentCount;

                var compareEl = document.getElementById('stat-compare');
                if (lastTotal > 0) {
                    var diff = ((currentTotal - lastTotal) / lastTotal * 100);
                    var diffStr = (diff > 0 ? '+' : '') + diff.toFixed(0) + '%';
                    compareEl.textContent = diffStr;
                    compareEl.className = 'value ' + (diff > 0 ? 'red' : 'green');
                } else if (currentTotal > 0) {
                    compareEl.textContent = '+100%';
                    compareEl.className = 'value red';
                } else {
                    compareEl.textContent = '—';
                    compareEl.className = 'value';
                }
            }

            function renderTransactions() {
                var container = document.getElementById('transaction-list');
                var empty = document.getElementById('empty-state');

                var filtered = transactions.slice();
                if (currentFilter !== 'all') {
                    filtered = filtered.filter(function(t) { return t.category === currentFilter; });
                }

                filtered.sort(function(a, b) { return b.timestamp - a.timestamp; });

                if (filtered.length === 0) {
                    container.innerHTML = '';
                    empty.style.display = 'block';
                    return;
                }
                empty.style.display = 'none';

                var html = '';
                var lastDate = '';

                filtered.forEach(function(t, index) {
                    var dateKey = getTodayKeyFromTS(t.timestamp);
                    var dateStr = formatDate(t.timestamp);

                    if (dateKey !== lastDate) {
                        if (lastDate !== '') html += '</div>';
                        html += '<div class="date-header mt-1">' + dateStr + '</div>';
                        html += '<div class="flex flex-col gap-1">';
                        lastDate = dateKey;
                    }

                    var hours = t.amount / hourlyWage;
                    var icon = getCategoryIcon(t.category);

                    html += `
                        <div class="transaction-item flex items-center justify-between px-3 py-2.5 rounded-xl bg-surface-container-lowest hover:bg-surface-container-low transition-colors cursor-default">
                            <div class="flex items-center gap-3 min-w-0 flex-1">
                                <span class="text-lg">${icon}</span>
                                <div class="min-w-0 flex-1">
                                    <div class="font-body-md text-body-md text-primary truncate">${t.name}</div>
                                    <div class="flex items-center gap-2 text-xs text-on-surface-variant/50">
                                        <span>${getCategoryLabel(t.category)}</span>
                                        ${t.note ? '<span>· ' + t.note + '</span>' : ''}
                                    </div>
                                </div>
                            </div>
                            <div class="text-right flex items-center gap-2 flex-shrink-0">
                                <div>
                                    <div class="font-body-md text-body-md text-primary font-medium">¥${t.amount.toFixed(2)}</div>
                                    <div class="text-xs text-on-surface-variant/40">${hours.toFixed(1)}h</div>
                                </div>
                                <button class="delete-txn-btn text-on-surface-variant/30 hover:text-error transition-colors p-1" data-id="${t.id}" aria-label="删除">
                                    <span class="material-symbols-outlined text-[16px]">close</span>
                                </button>
                            </div>
                        </div>
                    `;
                });

                html += '</div>';
                container.innerHTML = html;

                container.querySelectorAll('.delete-txn-btn').forEach(function(btn) {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        var id = parseFloat(this.dataset.id);
                        if (confirm('确定要删除这条记录吗？')) {
                            transactions = transactions.filter(function(t) { return t.id !== id; });
                            saveTransactions(transactions);
                            renderAll();
                        }
                    });
                });
            }

            function getTodayKeyFromTS(ts) {
                var d = new Date(ts);
                return d.getFullYear() + '-' +
                    String(d.getMonth() + 1).padStart(2, '0') + '-' +
                    String(d.getDate()).padStart(2, '0');
            }

            // ============================================================
            // 🆕 价格表渲染（恢复工时显示）
            // ============================================================
            function renderItems() {
                var container = document.getElementById('items-container');
                if (!container) return;

                if (items.length === 0) {
                    container.innerHTML = `
                        <div class="text-center py-6 text-on-surface-variant/60 text-sm">
                            还没有物品，点击下方添加
                        </div>
                    `;
                    return;
                }

                var html = '';
                items.forEach(function(item, index) {
                    var hours = item.price / hourlyWage;
                    var days = hours / workHoursPerDay;
                    html += `
                        <div class="price-card bg-surface-container-lowest rounded-xl p-4 shadow-[0_4px_16px_rgba(0,0,0,0.04)] flex flex-col gap-2 transition-transform active:scale-[0.98] duration-300" data-index="${index}">
                            <div class="flex justify-between items-start">
                                <h4 class="font-body-md text-body-md text-primary font-medium">
                                    <span class="material-symbols-outlined text-[20px] align-middle text-tertiary-fixed-dim">${item.icon || 'shopping_bag'}</span>
                                    ${item.name}
                                </h4>
                                <div class="flex items-center gap-2">
                                    <span class="font-label-sm text-label-sm text-on-surface-variant bg-surface-container px-2 py-0.5 rounded item-price">¥${item.price.toLocaleString()}</span>
                                    <button class="delete-item-btn text-on-surface-variant/30 hover:text-error transition-colors p-1 -mr-1" data-index="${index}" aria-label="删除">
                                        <span class="material-symbols-outlined text-[16px]">close</span>
                                    </button>
                                </div>
                            </div>
                            <div class="bg-surface-bright rounded-lg p-3 flex flex-col gap-1 border border-surface-variant/30">
                                <div class="flex items-baseline gap-2">
                                    <span class="text-sm text-on-surface-variant">需要工作</span>
                                    <span class="font-headline-md-mobile text-headline-md-mobile text-primary tracking-tight req-hours">${Math.ceil(hours)}</span>
                                    <span class="text-sm text-on-surface-variant">小时</span>
                                </div>
                                <p class="text-xs text-on-surface-variant/60 flex items-center gap-1">
                                    <span class="material-symbols-outlined text-[14px]">calendar_today</span>
                                    约 <span class="req-days">${Math.ceil(days)}</span> 个工作日
                                </p>
                            </div>
                            <div class="flex justify-end">
                                <button class="text-xs text-tertiary-fixed-dim hover:text-tertiary-fixed-dim/70 transition-colors flex items-center gap-1 quick-buy-btn" data-index="${index}">
                                    <span class="material-symbols-outlined text-[14px]" style="font-variation-settings:'FILL'1;">shopping_cart</span>
                                    记一笔
                                </button>
                            </div>
                        </div>
                    `;
                });

                container.innerHTML = html;

                container.querySelectorAll('.quick-buy-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var index = parseInt(this.dataset.index);
                        var item = items[index];
                        if (item) {
                            openModal(item.name, item.price);
                        }
                    });
                });

                container.querySelectorAll('.delete-item-btn').forEach(function(btn) {
                    btn.addEventListener('click', function() {
                        var index = parseInt(this.dataset.index);
                        if (confirm('确定要删除「' + items[index].name + '」吗？')) {
                            items.splice(index, 1);
                            saveItems(items);
                            renderItems();
                        }
                    });
                });
            }

            function renderAll() {
                renderLifeHours();
                renderStats();
                renderTransactions();
                renderItems();
            }

            // ============================================================
            // 7. 弹窗逻辑
            // ============================================================
            var modal = document.getElementById('transaction-modal');
            var modalName = document.getElementById('txn-name');
            var modalAmount = document.getElementById('txn-amount');
            var modalNote = document.getElementById('txn-note');
            var modalHours = document.getElementById('txn-hours-preview');
            var selectedCategory = '餐饮';

            function openModal(name, amount) {
                modalName.value = name || '';
                modalAmount.value = amount || '';
                modalNote.value = '';
                selectedCategory = '餐饮';
                document.querySelectorAll('.category-option').forEach(function(el) {
                    el.classList.toggle('selected', el.dataset.category === '餐饮');
                });
                updateHoursPreview();
                modal.classList.add('show');
                setTimeout(function() { modalName.focus(); }, 300);
            }

            function closeModal() {
                modal.classList.remove('show');
            }

            function updateHoursPreview() {
                var amount = parseFloat(modalAmount.value) || 0;
                var hours = amount / hourlyWage;
                modalHours.textContent = hours.toFixed(1) + ' 小时';
            }

            document.querySelectorAll('.category-option').forEach(function(el) {
                el.addEventListener('click', function() {
                    document.querySelectorAll('.category-option').forEach(function(e) { e.classList.remove('selected'); });
                    this.classList.add('selected');
                    selectedCategory = this.dataset.category;
                });
            });

            modalAmount.addEventListener('input', updateHoursPreview);

            document.getElementById('modal-close-btn').addEventListener('click', closeModal);
            modal.addEventListener('click', function(e) {
                if (e.target === this) closeModal();
            });

            document.getElementById('modal-save-btn').addEventListener('click', function() {
                var name = modalName.value.trim();
                var amount = parseFloat(modalAmount.value);
                var note = modalNote.value.trim();

                if (!name) {
                    alert('请输入名称');
                    modalName.focus();
                    return;
                }
                if (isNaN(amount) || amount <= 0) {
                    alert('请输入有效的金额');
                    modalAmount.focus();
                    return;
                }

                var txn = {
                    id: Date.now() + Math.random() * 1000,
                    name: name,
                    amount: Math.round(amount * 100) / 100,
                    category: selectedCategory,
                    timestamp: Date.now(),
                    note: note || ''
                };

                transactions.push(txn);
                saveTransactions(transactions);
                renderAll();
                closeModal();

                var hours = (amount / hourlyWage).toFixed(1);
                alert('✅ 已记录：' + name + '\n金额：¥' + amount.toFixed(2) + '\n相当于工作 ' + hours + ' 小时');
            });

            document.getElementById('btn-add-transaction').addEventListener('click', function() {
                openModal('', '');
            });

            // ============================================================
            // 8. 筛选器
            // ============================================================
            document.querySelectorAll('.filter-tag').forEach(function(btn) {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-tag').forEach(function(b) { b.classList.remove('active'); });
                    this.classList.add('active');
                    currentFilter = this.dataset.category;
                    renderTransactions();
                });
            });

            // ============================================================
            // 9. 价格表折叠
            // ============================================================
            var priceListVisible = false;
            document.getElementById('toggle-price-list').addEventListener('click', function() {
                priceListVisible = !priceListVisible;
                var container = document.getElementById('price-list-container');
                var icon = this.querySelector('.material-symbols-outlined');
                if (priceListVisible) {
                    container.style.display = 'flex';
                    icon.textContent = 'expand_less';
                } else {
                    container.style.display = 'none';
                    icon.textContent = 'expand_more';
                }
            });

            document.getElementById('btn-add-item').addEventListener('click', function() {
                var name = prompt('请输入物品名称（如：MacBook Pro）:');
                if (!name || name.trim() === '') return;
                var priceStr = prompt('请输入物品价格（如：12999）:');
                if (!priceStr) return;
                var price = parseFloat(priceStr.replace(/[^\d.]/g, ''));
                if (isNaN(price) || price <= 0) {
                    alert('请输入有效的价格');
                    return;
                }
                items.push({ icon: 'shopping_bag', name: name.trim(), price: price });
                saveItems(items);
                renderItems();
            });

            // ============================================================
            // 10. 快捷键
            // ============================================================
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModal();
                if (e.key === 'Enter' && modal.classList.contains('show')) {
                    document.getElementById('modal-save-btn').click();
                }
            });

            // ============================================================
            // 11. 初始化
            // ============================================================
            renderAll();

            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    var fresh = localStorage.getItem('timeValueData');
                    if (fresh) {
                        try {
                            var freshData = JSON.parse(fresh);
                            var newSalary = freshData.monthlySalary || 10000;
                            var newWorkDays = freshData.workDays || 22;
                            var newWorkHours = freshData.workHoursPerDay || 8;
                            if (newSalary !== salary || newWorkDays !== workDays || newWorkHours !== workHoursPerDay) {
                                salary = newSalary;
                                workDays = newWorkDays;
                                workHoursPerDay = newWorkHours;
                                hourlyWage = salary / (workDays * workHoursPerDay);
                                document.getElementById('hourly-wage-display').textContent = '¥' + hourlyWage.toFixed(2);
                                renderAll();
                            }
                        } catch (e) {}
                    }
                    var freshTxns = loadTransactions();
                    if (freshTxns.length !== transactions.length) {
                        transactions = freshTxns;
                        renderAll();
                    }
                }
            });

        });
    </script>
</body>
</html>
